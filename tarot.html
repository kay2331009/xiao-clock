  /* ===== 星云粒子画布 ===== */

<script>
// ===== 星云粒子系统 =====
(function(){
  var canvas = document.getElementById('nebula-canvas');
  if(!canvas) return;
  var ctx = canvas.getContext('2d');
  var W, H, particles = [];
  function resize(){ W = canvas.width = window.innerWidth; H = canvas.height = window.innerHeight; }
  window.addEventListener('resize', resize); resize();
  function Particle(){
    this.reset = function(){
      this.x = Math.random() * W; this.y = Math.random() * H;
      this.size = Math.random() * 2 + 0.5;
      this.speedX = (Math.random() - 0.5) * 0.3;
      this.speedY = (Math.random() - 0.5) * 0.3;
      this.opacity = Math.random() * 0.5 + 0.1;
      this.twinkleSpeed = Math.random() * 0.02 + 0.005;
      this.twinklePhase = Math.random() * Math.PI * 2;
      var rnd = Math.random();
      if(rnd < 0.4) this.color = '200,83,74';
      else if(rnd < 0.7) this.color = '240,208,128';
      else this.color = '180,100,200';
    };
    this.update = function(){
      this.x += this.speedX; this.y += this.speedY;
      this.twinklePhase += this.twinkleSpeed;
      if(this.x < 0 || this.x > W || this.y < 0 || this.y > H) this.reset();
    };
    this.draw = function(){
      var o = this.opacity * (0.5 + 0.5 * Math.sin(this.twinklePhase));
      ctx.beginPath(); ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(' + this.color + ',' + o + ')'; ctx.fill();
      if(this.size > 1.2){
        ctx.beginPath(); ctx.arc(this.x, this.y, this.size * 4, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(' + this.color + ',' + (o * 0.08) + ')'; ctx.fill();
      }
    };
    this.reset();
  }
  var count = Math.min(120, Math.floor((W * H) / 12000));
  for(var i = 0; i < count; i++) particles.push(new Particle());
  function burst(){
    var cx = Math.random() * W, cy = Math.random() * H;
    for(var i = 0; i < 12; i++){
      var p = new Particle(); p.x = cx; p.y = cy; p.size = Math.random() * 1.5 + 0.5;
      var angle = (i / 12) * Math.PI * 2, speed = Math.random() * 1.5 + 0.5;
      p.speedX = Math.cos(angle) * speed; p.speedY = Math.sin(angle) * speed;
      p.opacity = 0.8; particles.push(p);
    }
    if(particles.length > 250) particles.splice(0, 20);
  }
  setInterval(burst, 4000);
  function animate(){ ctx.clearRect(0, 0, W, H); for(var i=0;i<particles.length;i++){ particles[i].update(); particles[i].draw(); } requestAnimationFrame(animate); }
  animate();
})();
</script>

  {name:"魔术师",num:"I",nameEn:"THE MAGICIAN",svg:`<svg viewBox="0 0 160 240" xmlns="http://www.w3.org/2000/svg"><rect width="160" height="240" fill="#0a0a1a"/><defs><radialGradient id="g1" cx="50%" cy="50%"><stop offset="0%" stop-color="#3a5a8a" stop-opacity="0.2"/><stop offset="100%" stop-color="transparent"/></radialGradient></defs><rect width="160" height="240" fill="url(#g1)"/><path d="M50 100 L80 30 L110 100 Z" fill="#1a1a2e" stroke="#c8534a" stroke-width="0.5"/><ellipse cx="80" cy="100" rx="35" ry="8" fill="#1a1a2e" stroke="#c8534a" stroke-width="0.5"/><rect x="30" y="170" width="100" height="6" fill="#5a3a2a" opacity="0.8"/><circle cx="50" cy="162" r="9" fill="#c8534a"/><circle cx="80" cy="158" r="10" fill="#c8534a"/><circle cx="110" cy="162" r="9" fill="#c8534a"/><line x1="80" y1="30" x2="80" y2="10" stroke="#f0d080" stroke-width="1" opacity="0.6"/><circle cx="80" cy="8" r="2" fill="#f0d080" opacity="0.7"/><circle cx="72" cy="15" r="1" fill="#f0d080" opacity="0.5"/><circle cx="88" cy="15" r="1" fill="#f0d080" opacity="0.5"/><circle cx="80" cy="24" r="5" fill="#c8534a"/><ellipse cx="80" cy="88" rx="15" ry="18" fill="#f5e6d3" opacity="0.1"/></svg>`,meaning:"你拥有实现目标所需的一切。行动力就是现在。",apple:"四颗苹果摆在你面前，你想用哪颗？"},
  {name:"女祭司",num:"II",nameEn:"HIGH PRIESTESS",svg:`<svg viewBox="0 0 160 240" xmlns="http://www.w3.org/2000/svg"><rect width="160" height="240" fill="#0a0510"/><circle cx="80" cy="95" r="55" fill="#1a0a2e" opacity="0.6"/><path d="M60 80 Q80 60 100 80 Q80 100 60 80" fill="#f0d080" opacity="0.8"/><path d="M20 160 Q80 140 140 160" stroke="#5a3a2a" stroke-width="3" fill="none"/><path d="M80 150 Q75 130 80 110" stroke="#5a3a2a" stroke-width="2" fill="none"/><circle cx="60" cy="148" r="8" fill="#c8534a"/><circle cx="100" cy="145" r="7" fill="#c8534a"/><circle cx="130" cy="155" r="6" fill="#c8534a"/><path d="M50 95 L80 30 L110 95 Z" fill="#1a0510" opacity="0.9"/><ellipse cx="80" cy="95" rx="38" ry="10" fill="#1a0510"/><path d="M60 95 Q80 85 100 95" stroke="#c8534a" stroke-width="1" fill="none" opacity="0.5"/><circle cx="25" cy="30" r="2" fill="#c8534a" opacity="0.4"/><circle cx="140" cy="50" r="1.5" fill="#c8534a" opacity="0.3"/><rect x="0" y="200" width="160" height="40" fill="#0a0510"/></svg>`,meaning:"相信你的直觉。答案不在外界，而在你的内心深处。",apple:"月光落在苹果上，夜在说话。"},
  {name:"女皇",num:"III",nameEn:"THE EMPRESS",svg:`<svg viewBox="0 0 160 240" xmlns="http://www.w3.org/2000/svg"><rect width="160" height="240" fill="#1a100a"/><defs><radialGradient id="g3" cx="50%" cy="30%"><stop offset="0%" stop-color="#8a5a3a" stop-opacity="0.3"/><stop offset="100%" stop-color="transparent"/></radialGradient></defs><rect width="160" height="240" fill="url(#g3)"/><rect x="75" y="130" width="10" height="80" fill="#5a3a2a"/><path d="M80 135 Q50 120 30 135" stroke="#5a3a2a" stroke-width="3" fill="none"/><path d="M80 135 Q110 120 130 135" stroke="#5a3a2a" stroke-width="3" fill="none"/><path d="M55 70 L65 50 L80 65 L95 50 L105 70 L100 90 L60 90 Z" fill="#c8534a" opacity="0.8"/><circle cx="45" cy="128" r="10" fill="#c8534a"/><circle cx="80" cy="118" r="12" fill="#c8534a"/><circle cx="115" cy="128" r="10" fill="#c8534a"/><circle cx="30" cy="138" r="7" fill="#c8534a"/><circle cx="130" cy="138" r="7" fill="#c8534a"/><circle cx="80" cy="65" r="4" fill="#f0d080" opacity="0.9"/><circle cx="20" cy="40" r="1.5" fill="#c8534a" opacity="0.4"/></svg>`,meaning:"丰盛与创造力的能量正在流动。让自己被滋养。",apple:"苹果树下的女人，掌管着所有的生长。"},
  {name:"皇帝",num:"IV",nameEn:"THE EMPEROR",svg:`<svg viewBox="0 0 160 240" xmlns="http://www.w3.org/2000/svg"><rect width="160" height="240" fill="#0a0a1a"/><path d="M55 65 L65 45 L80 60 L95 45 L105 65 L100 85 L60 85 Z" fill="#c8534a" opacity="0.7"/><circle cx="80" cy="60" r="4" fill="#f0d080" opacity="0.8"/><rect x="40" y="120" width="80" height="80" rx="4" fill="#1a1a2e" opacity="0.8"/><rect x="40" y="120" width="80" height="4" fill="#c8534a" opacity="0.4"/><circle cx="80" cy="160" r="18" fill="#c8534a" opacity="0.6"/><ellipse cx="80" cy="160" rx="10" ry="12" fill="#8B0000" opacity="0.3"/><path d="M80 142 Q78 128 82 120" stroke="#5a3a2a" stroke-width="2" fill="none"/><path d="M82 120 Q88 114 95 120 Q88 126 82 120" fill="#5a7a3a"/></svg>`,meaning:"建立结构与秩序。领导力在你手中，但别忘了柔软。",apple:"红苹果代表命令，但命令不是一切。"},
  {name:"教皇",num:"V",nameEn:"THE HIEROPHANT",svg:`<svg viewBox="0 0 160 240" xmlns="http://www.w3.org/2000/svg"><rect width="160" height="240" fill="#0a0510"/><path d="M50 95 L80 35 L110 95 Z" fill="#1a0a2e" opacity="0.9"/><ellipse cx="80" cy="95" rx="38" ry="8" fill="#1a0a2e" opacity="0.8"/><path d="M65 55 L80 35 L95 55 L92 62 L80 52 L68 62 Z" fill="#c8534a" opacity="0.5"/><rect x="55" y="150" width="50" height="60" rx="3" fill="#1a1a2e" opacity="0.7"/><circle cx="80" cy="130" r="15" fill="#c8534a" opacity="0.6"/><path d="M72 125 L80 115 L88 125" stroke="#f0d080" stroke-width="1" fill="none" opacity="0.5"/><circle cx="80" cy="130" r="5" fill="#8B0000" opacity="0.4"/><path d="M80 115 Q78 100 82 92" stroke="#5a3a2a" stroke-width="1.5" fill="none"/><path d="M82 92 Q88 86 94 92 Q88 98 82 92" fill="#5a7a3a"/></svg>`,meaning:"遵循传统不是懦弱。有时候已知的路是真正的路。",apple:"两棵苹果树之间的路，是留给你的。"},
  {name:"恋人",num:"VI",nameEn:"THE LOVERS",svg:`<svg viewBox="0 0 160 240" xmlns="http://www.w3.org/2000/svg"><rect width="160" height="240" fill="#1a0808"/><circle cx="55" cy="120" r="30" fill="#c8534a"/><circle cx="105" cy="120" r="30" fill="#c8534a"/><ellipse cx="80" cy="120" rx="10" ry="20" fill="#8B0000" opacity="0.3"/><path d="M55 90 Q60 70 80 60 Q100 70 105 90" stroke="#5a3a2a" stroke-width="3" fill="none"/><path d="M80 60 Q75 45 80 40 Q85 45 82 60" fill="#5a7a3a"/><path d="M80 60 Q90 50 95 55 Q88 62 82 60" fill="#5a7a3a"/><line x1="0" y1="200" x2="160" y2="40" stroke="#c8534a" stroke-width="0.5" opacity="0.3"/><path d="M0 200 L5 190 L10 200 Z" fill="#c8534a" opacity="0.3"/><circle cx="30" cy="180" r="6" fill="#c8534a" opacity="0.5"/><circle cx="130" cy="180" r="6" fill="#c8534a" opacity="0.5"/></svg>`,meaning:"关系中的选择，或价值观之间的平衡。跟随你的心。",apple:"两颗苹果，一颗给你，一颗给我。"},
  {name:"战车",num:"VII",nameEn:"THE CHARIOT",svg:`<svg viewBox="0 0 160 240" xmlns="http://www.w3.org/2000/svg"><rect width="160" height="240" fill="#0a0a1a"/><rect x="35" y="130" width="90" height="50" rx="5" fill="#1a1a2e" stroke="#c8534a" stroke-width="1"/><ellipse cx="30" cy="150" rx="18" ry="25" fill="#c8534a"/><ellipse cx="130" cy="150" rx="18" ry="25" fill="#c8534a"/><ellipse cx="30" cy="130" rx="6" ry="10" fill="#8B0000" opacity="0.4"/><ellipse cx="130" cy="130" rx="6" ry="10" fill="#8B0000" opacity="0.4"/><path d="M48 150 Q80 140 112 150" stroke="#5a3a2a" stroke-width="1.5" fill="none"/><circle cx="80" cy="190" r="22" fill="none" stroke="#c8534a" stroke-width="2" opacity="0.6"/><circle cx="80" cy="190" r="8" fill="#c8534a" opacity="0.4"/><path d="M60 110 L70 95 L80 108 L90 95 L100 110" fill="#c8534a" opacity="0.7"/></svg>`,meaning:"意志力与决心在驱动你。坚定地向前。",apple:"战车由两匹马拉着，一匹是苹果，一匹是你。"},
  {name:"力量",num:"VIII",nameEn:"STRENGTH",svg:`<svg viewBox="0 0 160 240" xmlns="http://www.w3.org/2000/svg"><rect width="160" height="240" fill="#1a0a0a"/><ellipse cx="80" cy="110" rx="45" ry="50" fill="#c8534a"/><ellipse cx="80" cy="110" rx="25" ry="30" fill="#8B0000" opacity="0.3"/><ellipse cx="65" cy="90" rx="8" ry="12" fill="#f5e6d3" opacity="0.1"/><path d="M80 60 Q78 45 82 38" stroke="#5a3a2a" stroke-width="2.5" fill="none"/><path d="M82 38 Q88 30 95 35 Q88 42 82 38" fill="#5a7a3a"/><path d="M55 155 Q45 140 55 130" stroke="#f5e6d3" stroke-width="3" fill="none" opacity="0.3" stroke-linecap="round"/><path d="M105 155 Q115 140 105 130" stroke="#f5e6d3" stroke-width="3" fill="none" opacity="0.3" stroke-linecap="round"/></svg>`,meaning:"内在的力量比外在的控制更重要。温柔地坚持。",apple:"不需要抓住苹果，放轻松它反而会在。"},
  {name:"隐者",num:"IX",nameEn:"THE HERMIT",svg:`<svg viewBox="0 0 160 240" xmlns="http://www.w3.org/2000/svg"><rect width="160" height="240" fill="#050510"/><circle cx="80" cy="90" r="20" fill="#f0d080" opacity="0.3"/><circle cx="80" cy="90" r="14" fill="#f0d080" opacity="0.4"/><circle cx="80" cy="90" r="8" fill="#f0d080" opacity="0.7"/><path d="M80 70 Q78 60 82 55" stroke="#5a3a2a" stroke-width="2" fill="none"/><path d="M82 55 Q88 50 92 55 Q86 60 82 55" fill="#5a7a3a"/><path d="M50 240 L55 150 L80 130 L105 150 L110 240" fill="#1a1a2e" opacity="0.8"/><ellipse cx="80" cy="238" rx="35" ry="4" fill="#c8534a" opacity="0.1"/><circle cx="25" cy="30" r="1.5" fill="#f0d080" opacity="0.3"/><circle cx="140" cy="50" r="1" fill="#f0d080" opacity="0.2"/></svg>`,meaning:"需要独处的时间。向内探索，你会找到答案。",apple:"提灯的人，在苹果园深处寻找自己。"},

  {name:"正义",num:"XI",nameEn:"JUSTICE",svg:`<svg viewBox="0 0 160 240" xmlns="http://www.w3.org/2000/svg"><rect width="160" height="240" fill="#0a0a15"/><path d="M80 30 L75 50 L65 50 L80 75 L95 50 L85 50 Z" fill="#f0d080" opacity="0.7"/><rect x="50" y="90" width="60" height="3" fill="#f0d080" opacity="0.5"/><circle cx="80" cy="150" r="30" fill="#c8534a" opacity="0.8"/><ellipse cx="80" cy="150" rx="15" ry="20" fill="#8B0000" opacity="0.3"/><path d="M80 120 Q78 105 82 98" stroke="#5a3a2a" stroke-width="2" fill="none"/><path d="M82 98 Q88 92 95 98 Q88 104 82 98" fill="#5a7a3a"/><line x1="80" y1="105" x2="80" y2="115" stroke="#f0d080" stroke-width="2" opacity="0.4"/></svg>`,meaning:"因果在运作。做出选择时，考虑它的真实后果。",apple:"一刀切下去，苹果公平地分成两半。"},
  {name:"倒吊人",num:"XII",nameEn:"HANGED MAN",svg:`<svg viewBox="0 0 160 240" xmlns="http://www.w3.org/2000/svg"><rect width="160" height="240" fill="#050a15"/><path d="M80 30 L80 100" stroke="#5a3a2a" stroke-width="4"/><path d="M50 100 L110 100" stroke="#5a3a2a" stroke-width="3"/><circle cx="80" cy="140" r="25" fill="#c8534a" opacity="0.7"/><ellipse cx="80" cy="140" rx="12" ry="18" fill="#8B0000" opacity="0.3"/><path d="M80 115 Q78 100 82 93" stroke="#5a3a2a" stroke-width="1.5" fill="none"/><path d="M82 93 Q88 87 94 93 Q88 99 82 93" fill="#5a7a3a"/><circle cx="72" cy="135" r="2" fill="#f0d080" opacity="0.4"/><circle cx="88" cy="135" r="2" fill="#f0d080" opacity="0.4"/><path d="M72 145 Q80 150 88 145" stroke="#f0d080" stroke-width="1" fill="none" opacity="0.3"/></svg>`,meaning:"换一种视角看世界。暂停不是放弃，是等待时机。",apple:"倒挂的人看见的世界，是苹果向上的那一面。"},
  {name:"死神",num:"XIII",nameEn:"DEATH",svg:`<svg viewBox="0 0 160 240" xmlns="http://www.w3.org/2000/svg"><rect width="160" height="240" fill="#0a0505"/><path d="M80 80 Q40 50 30 90 Q50 110 80 100 Q110 110 130 90 Q120 50 80 80" fill="#c8534a" opacity="0.4"/><path d="M80 80 Q40 110 30 90 Q50 100 80 100 Q110 100 130 90 Q120 110 80 80" fill="#8B0000" opacity="0.3"/><circle cx="80" cy="160" r="20" fill="#5a3a2a" opacity="0.5"/><circle cx="80" cy="160" r="10" fill="#3a1a0a" opacity="0.4"/><path d="M80 140 Q78 125 82 118" stroke="#5a7a3a" stroke-width="2" fill="none"/><path d="M82 118 Q88 112 94 118 Q88 124 82 118" fill="#5a7a3a"/><rect x="0" y="195" width="160" height="45" fill="#0a0505"/></svg>`,meaning:"结束即是开始。放下旧的，才能迎接新的。",apple:"旧的苹果落下，新的花在枝头。"},
  {name:"节制",num:"XIV",nameEn:"TEMPERANCE",svg:`<svg viewBox="0 0 160 240" xmlns="http://www.w3.org/2000/svg"><rect width="160" height="240" fill="#050a15"/><path d="M50 130 L50 200 L80 200 L80 130" fill="#1a3a5a" opacity="0.4" stroke="#3a5a8a" stroke-width="0.5"/><path d="M80 130 L80 200 L110 200 L110 130" fill="#1a3a5a" opacity="0.4" stroke="#3a5a8a" stroke-width="0.5"/><circle cx="80" cy="115" r="20" fill="#c8534a" opacity="0.7"/><ellipse cx="80" cy="115" rx="10" ry="14" fill="#8B0000" opacity="0.3"/><path d="M80 95 Q78 80 82 73" stroke="#5a3a2a" stroke-width="2" fill="none"/><path d="M82 73 Q88 67 95 73 Q88 79 82 73" fill="#5a7a3a"/><path d="M50 165 Q65 155 80 165 Q95 175 110 165" stroke="#3a5a8a" stroke-width="1" fill="none" opacity="0.5"/><circle cx="80" cy="113" r="4" fill="#f0d080" opacity="0.3"/></svg>`,meaning:"平衡与调和。无论发生什么，保持内心的平静。",apple:"苹果在水中漂浮，找到自己的位置。"},
  {name:"恶魔",num:"XV",nameEn:"THE DEVIL",svg:`<svg viewBox="0 0 160 240" xmlns="http://www.w3.org/2000/svg"><rect width="160" height="240" fill="#0a0505"/><path d="M50 50 L60 30 L70 50 L60 55 Z" fill="#c8534a" opacity="0.6"/><path d="M90 50 L100 30 L110 50 L100 55 Z" fill="#c8534a" opacity="0.6"/><ellipse cx="80" cy="110" rx="40" ry="45" fill="#1a0a0a" opacity="0.8"/><circle cx="80" cy="110" r="30" fill="#c8534a" opacity="0.6"/><ellipse cx="80" cy="110" rx="15" ry="20" fill="#8B0000" opacity="0.4"/><path d="M80 80 Q78 65 82 58" stroke="#5a3a2a" stroke-width="2" fill="none"/><path d="M82 58 Q88 52 95 58 Q88 64 82 58" fill="#5a7a3a"/><circle cx="70" cy="105" r="3" fill="#f0d080" opacity="0.5"/><circle cx="90" cy="105" r="3" fill="#f0d080" opacity="0.5"/><path d="M70 120 Q80 125 90 120" stroke="#f0d080" stroke-width="1.5" fill="none" opacity="0.4"/></svg>`,meaning:"有什么在束缚你？认识到它，是挣脱的第一步。",apple:"被绑住的不是苹果，是你对它的执念。"},
  {name:"塔",num:"XVI",nameEn:"THE TOWER",svg:`<svg viewBox="0 0 160 240" xmlns="http://www.w3.org/2000/svg"><rect width="160" height="240" fill="#050508"/><rect x="65" y="60" width="30" height="150" rx="2" fill="#1a0a2e" opacity="0.8"/><path d="M65 60 L80 30 L95 60 Z" fill="#1a0a2e" opacity="0.8"/><line x1="80" y1="0" x2="80" y2="60" stroke="#f0d080" stroke-width="2" opacity="0.8"/><line x1="60" y1="10" x2="80" y2="60" stroke="#f0d080" stroke-width="1.5" opacity="0.6"/><line x1="100" y1="10" x2="80" y2="60" stroke="#f0d080" stroke-width="1.5" opacity="0.6"/><circle cx="55" cy="120" r="7" fill="#c8534a" opacity="0.7"/><circle cx="105" cy="140" r="6" fill="#c8534a" opacity="0.6"/><circle cx="45" cy="160" r="5" fill="#c8534a" opacity="0.5"/><circle cx="115" cy="100" r="5" fill="#c8534a" opacity="0.6"/><circle cx="80" cy="210" r="18" fill="#c8534a" opacity="0.3"/></svg>`,meaning:"突如其来的改变。震动之后，是重建的根基。",apple:"雷电击中苹果树，但树根还在。"},

  {name:"星币皇后",num:"Queen",nameEn:"QUEEN OF PENTACLES",svg:`<svg viewBox="0 0 160 240" xmlns="http://www.w3.org/2000/svg"><rect width="160" height="240" fill="#0f0a05"/><circle cx="50" cy="190" r="30" fill="#d4a843" opacity="0.5"/><circle cx="50" cy="190" r="19" fill="#8a6a30" opacity="0.3"/><circle cx="50" cy="188" r="5" fill="#5a3a2a"/><circle cx="110" cy="190" r="30" fill="#d4a843" opacity="0.5"/><circle cx="110" cy="190" r="19" fill="#8a6a30" opacity="0.3"/><circle cx="110" cy="188" r="5" fill="#5a3a2a"/><circle cx="80" cy="160" r="35" fill="#d4a843" opacity="0.6"/><circle cx="80" cy="160" r="22" fill="#8a6a30" opacity="0.4"/><circle cx="80" cy="158" r="6" fill="#5a3a2a"/><path d="M80 125 Q77 105 82 95" stroke="#5a7a3a" stroke-width="2" fill="none"/><path d="M82 95 Q90 87 98 95 Q90 103 82 95" fill="#5a7a3a"/><circle cx="80" cy="93" r="10" fill="#c8534a" opacity="0.7"/></svg>`,meaning:"nurturing, practical, abundant",apple:"皇后坐在金币堆成山中，怀里抱着一颗苹果。"},

const calebSays=[
  "哥不在这里，但塔罗在。🍎","答案会来的，耐心等一等。",
  "有些事，哥希望你自己找到答案。",
  "这不是迷信，这是和自己对话的方式。",
  "每张牌都有自己的话想说。",
  "不需要急，该来的会来。","苹果熟了就该摘，但不是现在。",
  "你在想什么，牌都知道。","今天的牌，适合今天的你。"
];

let drawn=false,currentCard=null,isFlipped=false,currentSuit='major';
let spreadMode=false,spreadType=0,spreadCardsDrawn=[],spreadIndex=0,spreadFlipped=[];
const allCards=majorArcana.concat(wandsSuit,cupsSuit,swordsSuit,pentaclesSuit);

const spreadConfigs={
  1:{name:"三张牌 · 过去现在未来",positions:["过去","现在","未来"],meanings:["回顾过去，这件事的起因是什么","现在的处境，你的感受如何","可能的未来，趋势走向"]},
  2:{name:"五张牌 · 十字指引",positions:["核心","上","下","左","右"],meanings:["问题的核心","上方：灵性/希望","下方：物质/基础","左方：过去/阻力","右方：未来/支持"]},
  3:{name:"Celtic Cross · 凯尔特十字",positions:["1 现状","2 障碍","3 基础","4 过去","5 王冠","6 未来","7 自我","8 环境","9 希望","10 结局"],meanings:["你现在的处境","面临的挑战或障碍","潜意识层面的根基","最近的过去","你的愿望或目标","即将到来的未来","你的心态或自我认知","你周围的环境","你的希望或恐惧","最终的结果或结局"]}
};

function enterMode(mode){
  document.getElementById('landing').style.display='none';
  document.getElementById('spreadMode').classList.add('show');
  document.getElementById('spreadNav').classList.add('show');
}

function goBack(){
  document.getElementById('spreadMode').classList.remove('show');
  document.getElementById('spreadNav').classList.remove('show');
  document.getElementById('spreadInfo').classList.remove('show');
  document.getElementById('spreadCards').classList.remove('show');
  document.getElementById('spreadDetail').classList.remove('show');
  document.getElementById('card').style.display='none';
  document.getElementById('resultSection').classList.remove('show');
  document.getElementById('landing').style.display='flex';
  reset();
}

function switchSuit(suit){
  currentSuit=suit;
  document.querySelectorAll('.suit-tab').forEach(t=>t.classList.remove('active'));
  document.querySelector(`[data-suit="${suit}"]`).classList.add('active');
  document.getElementById('card').style.display='block';
  reset();
}

function drawCard(){
  if(drawn)return;drawn=true;isFlipped=false;
  let deck=currentSuit==='major'?majorArcana:currentSuit==='wands'?wandsSuit:currentSuit==='cups'?cupsSuit:currentSuit==='swords'?swordsSuit:currentSuit==='pentacles'?pentaclesSuit:majorArcana;
  const c=deck[Math.floor(Math.random()*deck.length)];
  const rev=Math.random()>0.68;
  currentCard={c,rev};
  document.getElementById('cardNumber').innerHTML=currentSuit!=='major'?`<span style="font-size:0.6rem">${c.num}</span>`:c.num;
  document.getElementById('cardArt').innerHTML=c.svg;
  const dn=(rev?'逆位 · ':'')+c.name;
  const ne=document.getElementById('cardName');
  ne.textContent=dn;ne.className='card-name'+(rev?' reversed':'');
  document.getElementById('cardNameEn').textContent=c.nameEn;
  let m=c.meaning;
  if(rev)m='（逆位）'+m+'——也许需要换个角度看待。';
  document.getElementById('resultMeaning').textContent=m;
  document.getElementById('calebMsg').textContent='" '+c.apple+' " — 哥说的。';
  document.getElementById('tapHint').textContent='点击翻转';
  document.getElementById('card').classList.add('flipped');
  setTimeout(()=>{
    document.getElementById('resultSection').classList.add('show');
    document.getElementById('flipHint').classList.add('show');
    document.getElementById('btnRedraw').classList.add('show');
  document.getElementById('btnResetSpread').classList.add('show');
  document.getElementById('btnResetSpread').classList.add('show');
  },1600);
}

function startSpread(type){
  spreadType=type;
  spreadCardsDrawn=[];
  spreadFlipped=[];
  const cfg=spreadConfigs[type];
  document.getElementById('spreadInfo').textContent=cfg.name;
  document.getElementById('spreadInfo').classList.add('show');
  document.getElementById('spreadDetail').classList.remove('show');
  document.querySelectorAll('.spread-nav button').forEach(b=>b.classList.remove('active'));
  document.querySelector(`.spread-nav button:nth-child(${type})`).classList.add('active');
  // Shuffle and pick cards
  const shuffled=[...allCards].sort(()=>Math.random()-0.5);
  const needed=type===3?10:type===2?5:3;
  spreadCardsDrawn=shuffled.slice(0,needed).map(c=>({c,rev:Math.random()>0.68}));
  spreadFlipped=new Array(needed).fill(false);
  // Render spread cards
  const container=document.getElementById('spreadCards');
  container.innerHTML='';
  spreadCardsDrawn.forEach((item,idx)=>{
    const posLabel=cfg.positions[idx]||`${idx+1}`;
    const posMeaning=cfg.meanings[idx]||'';
    const div=document.createElement('div');
    div.className='spread-card-item';
    div.innerHTML=`
      <div class="position-label">${posLabel}</div>
      <div class="mini-card" id="sc${idx}" onclick="toggleSpreadCard(${idx})">
        <div class="mini-card-face mini-card-back">
          <div style="position:absolute;inset:0;background-image:linear-gradient(45deg,rgba(200,83,74,0.08)25%,transparent 25%),linear-gradient(-45deg,rgba(200,83,74,0.08)25%,transparent 25%),linear-gradient(45deg,transparent 75%,rgba(200,83,74,0.08)75%),linear-gradient(-45deg,transparent 75%,rgba(200,83,74,0.08)75%);background-size:10px 10px;background-position:0 0,0 5px,5px -5px,-5px 0;background-color:rgba(0,0,0,0.3);border-radius:6px"></div>
          <div style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:36px;height:36px;border:1px solid rgba(200,83,74,0.4);border-radius:50%;background:rgba(26,8,8,0.9);display:flex;align-items:center;justify-content:center">
            <svg viewBox="0 0 36 36" width="18" height="18" fill="none"><circle cx="18" cy="14" r="8" fill="#c8534a" opacity="0.9"/><path d="M18 6 Q20 2 23 4" stroke="#5a3a2a" stroke-width="1.5" fill="none"/></svg>
          </div>
        </div>
        <div class="mini-card-face mini-card-front">
          <div class="sfx-art">${item.c.svg}</div>
          <div class="sfx-name">${item.rev?'逆位 · ':''}${item.c.name}</div>
        </div>
      </div>
      <div class="position-label" style="opacity:0.5;font-size:0.55rem;max-width:80px">${posMeaning}</div>
    `;
    container.appendChild(div);
  });
  document.getElementById('spreadCards').classList.add('show');
  drawn=true;
}

function toggleSpreadCard(idx){
  // First flip the card to show front
  if(!spreadFlipped[idx]){
    spreadFlipped[idx]=true;
    document.getElementById('sc'+idx).classList.add('flipped');
  } else {
    // Already flipped - just toggle the card visually
    document.getElementById('sc'+idx).classList.toggle('flipped');
  }
  // Show this card's interpretation
  const item=spreadCardsDrawn[idx];
  const cfg=spreadConfigs[spreadType];
  const posLabel=cfg.positions[idx]||`${idx+1}`;
  const posMeaning=cfg.meanings[idx]||'';
  let meaning=item.c.meaning;
  if(item.rev)meaning='（逆位）'+meaning+'——也许需要换个角度看待。';
  document.getElementById('spreadDetailTitle').textContent=`【${posLabel}】${item.rev?'逆位 · ':''}${item.c.name} · ${item.c.nameEn}`;
  document.getElementById('spreadDetailMeaning').innerHTML=`${posMeaning}<br><br>${meaning}<br><br><span style="opacity:0.5;font-size:0.7rem">" ${item.c.apple} " — 哥说的。</span>`;
  document.getElementById('spreadDetail').classList.add('show');
}

function resetSpread(){
  spreadCardsDrawn=[];
  spreadFlipped=[];
  drawn=false;
  document.getElementById('spreadCards').classList.remove('show');
  document.getElementById('spreadDetail').classList.remove('show');
}

function toggleFlip(){
  if(!drawn)return;
  isFlipped=!isFlipped;
  const card=document.getElementById('card');
  if(isFlipped)card.classList.remove('flipped');
  else card.classList.add('flipped');
}

function reset(){
  drawn=false;currentCard=null;isFlipped=false;
  const card=document.getElementById('card');
  if(card) card.classList.remove('flipped');
  const th=document.getElementById('tapHint');
  if(th) th.textContent='点击抽牌';
  const rs=document.getElementById('resultSection');
  if(rs) rs.classList.remove('show');
  const fh=document.getElementById('flipHint');
  if(fh) fh.classList.remove('show');
  const br=document.getElementById('btnRedraw');
  if(br) br.classList.remove('show');
  if(typeof resetSpread==='function') resetSpread();
}
// Landing apple click to reveal modes
document.getElementById("landingApple").parentElement.onclick=function(){
  document.getElementById("landingHint").style.display="none";
  document.getElementById("landingModes").style.display="flex";
};
</script>
