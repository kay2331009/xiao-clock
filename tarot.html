<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Caleb 的苹果塔罗</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: radial-gradient(ellipse at 50% 20%, #1a0a2e 0%, #0d0d1a 60%, #050508 100%);
    min-height: 100vh;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
    color: #f0e6d3; overflow-x: hidden;
    padding: 24px 16px;
  }
  .title {
    font-size: 1.5rem; letter-spacing: 10px; margin-bottom: 4px;
    color: #c8534a; text-shadow: 0 0 24px rgba(200,83,74,0.5);
    text-align: center; position: relative; z-index: 1;
  }
  .subtitle {
    font-size: 0.65rem; opacity: 0.4; letter-spacing: 5px; margin-bottom: 32px;
    text-align: center; position: relative; z-index: 1;
    color: rgba(240,230,211,0.5);
  }
  .card-wrapper { perspective: 1200px; cursor: pointer; position: relative; z-index: 1; }
  .card {
    width: 240px; height: 408px;
    position: relative; transform-style: preserve-3d;
    transition: transform 1.4s cubic-bezier(0.23,1,0.32,1);
  }
  .card.flipped { transform: rotateY(180deg); }
  .card-face {
    position: absolute; width: 100%; height: 100%;
    backface-visibility: hidden; border-radius: 12px;
    overflow: hidden;
  }
  /* ===== CARD BACK ===== */
  .card-back {
    background: linear-gradient(160deg,#1a0808,#2a1010,#160808);
    border: 2px solid rgba(200,83,74,0.3);
    box-shadow: 0 0 50px rgba(200,83,74,0.15), inset 0 0 40px rgba(0,0,0,0.6);
    display: flex; align-items: center; justify-content: center;
  }
  .card-back-inner {
    width: 208px; height: 376px; border-radius: 8px;
    position: relative; overflow: hidden;
    border: 1px solid rgba(200,83,74,0.25);
  }
  /* Checkerboard pattern */
  .checkerboard {
    position: absolute; inset: 0;
    background-image:
      linear-gradient(45deg, rgba(200,83,74,0.08) 25%, transparent 25%),
      linear-gradient(-45deg, rgba(200,83,74,0.08) 25%, transparent 25%),
      linear-gradient(45deg, transparent 75%, rgba(200,83,74,0.08) 75%),
      linear-gradient(-45deg, transparent 75%, rgba(200,83,74,0.08) 75%);
    background-size: 16px 16px;
    background-position: 0 0, 0 8px, 8px -8px, -8px 0px;
    background-color: rgba(0,0,0,0.3);
  }
  .back-center {
    position: absolute; top: 50%; left: 50%;
    transform: translate(-50%,-50%);
    width: 80px; height: 80px;
    border: 1px solid rgba(200,83,74,0.4);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    background: rgba(26,8,8,0.9);
    box-shadow: 0 0 20px rgba(200,83,74,0.3);
  }
  .back-center svg { width: 36px; height: 36px; }
  .back-corner {
    position: absolute; width: 20px; height: 20px;
    border-color: rgba(200,83,74,0.35); border-style: solid;
  }
  .back-corner.tl { top: 6px; left: 6px; border-width: 1px 0 0 1px; }
  .back-corner.tr { top: 6px; right: 6px; border-width: 1px 1px 0 0; }
  .back-corner.bl { bottom: 6px; left: 6px; border-width: 0 0 1px 1px; }
  .back-corner.br { bottom: 6px; right: 6px; border-width: 0 1px 1px 0; }
  .tap-hint {
    position: absolute; bottom: 18px; left: 50%; transform: translateX(-50%);
    font-size: 0.6rem; color: rgba(200,83,74,0.5); letter-spacing: 3px;
    animation: pulse 2.5s ease-in-out infinite;
    white-space: nowrap;
  }
  @keyframes pulse { 0%,100%{opacity:0.4} 50%{opacity:1} }
  /* ===== CARD FRONT ===== */
  .card-front {
    background: linear-gradient(155deg,#1a0a0a,#241010);
    transform: rotateY(180deg);
    border: 2px solid rgba(200,83,74,0.25);
    box-shadow: 0 0 40px rgba(200,83,74,0.15), inset 0 0 40px rgba(0,0,0,0.3);
  }
  /* Red-white checkerboard border */
  .card-front .cb-border {
    position: absolute; inset: 0; pointer-events: none;
    border-radius: 12px;
    padding: 10px;
    background-image:
      linear-gradient(45deg, rgba(200,83,74,0.12) 25%, transparent 25%),
      linear-gradient(-45deg, rgba(200,83,74,0.12) 25%, transparent 25%),
      linear-gradient(45deg, transparent 75%, rgba(200,83,74,0.12) 75%),
      linear-gradient(-45deg, transparent 75%, rgba(200,83,74,0.12) 75%);
    background-size: 14px 14px;
    background-position: 0 0, 0 7px, 7px -7px, -7px 0px;
    background-color: rgba(0,0,0,0.25);
    border-radius: 12px;
  }
  .card-inner {
    position: absolute; inset: 12px; border-radius: 8px;
    border: 1px solid rgba(200,83,74,0.15);
    display: flex; flex-direction: column; overflow: hidden;
  }
  .card-number-circle {
    position: absolute; top: 8px; left: 50%; transform: translateX(-50%);
    width: 28px; height: 28px; border-radius: 50%;
    border: 1px solid rgba(200,83,74,0.5);
    background: rgba(26,10,10,0.9);
    display: flex; align-items: center; justify-content: center;
    font-size: 0.65rem; color: rgba(200,83,74,0.8); letter-spacing: 0;
  }
  .card-art-area {
    flex: 1; display: flex; align-items: center; justify-content: center;
    position: relative; overflow: hidden;
  }
  .card-art-area::before {
    content: ''; position: absolute; inset: 0;
    background: radial-gradient(ellipse at 50% 40%, rgba(200,83,74,0.08) 0%, transparent 65%);
  }
  .card-art-svg { width: 160px; height: 240px; position: relative; z-index: 1; }
  .card-bottom {
    padding: 8px 10px 10px;
    text-align: center; border-top: 1px solid rgba(200,83,74,0.12);
    background: rgba(0,0,0,0.2);
  }
  .card-name {
    font-size: 1rem; color: #c8534a; letter-spacing: 3px;
  }
  .card-name.reversed { color: #e07a5f; }
  .card-name-en {
    font-size: 0.5rem; color: rgba(200,83,74,0.45); letter-spacing: 2px; margin-top: 2px;
  }
  /* Result */
  .result-section {
    margin-top: 24px; text-align: center;
    opacity: 0; transform: translateY(14px);
    transition: opacity 0.8s, transform 0.8s;
    position: relative; z-index: 1; max-width: 340px;
  }
  .result-section.show { opacity: 1; transform: translateY(0); }
  .result-meaning {
    font-size: 0.85rem; line-height: 2; color: rgba(240,230,211,0.8);
    padding: 0 8px; margin-bottom: 14px;
  }
  .caleb-msg {
    font-size: 0.72rem; color: rgba(200,83,74,0.55);
    letter-spacing: 1px; font-style: italic; margin-bottom: 18px;
  }
  .btn {
    padding: 9px 28px; background: transparent;
    border: 1px solid rgba(200,83,74,0.3); color: #c8534a;
    border-radius: 30px; font-size: 0.72rem; letter-spacing: 2px;
    cursor: pointer; transition: all 0.3s; display: none;
  }
  .btn:hover { background: rgba(200,83,74,0.08); border-color: #c8534a; }
  .btn.show { display: inline-block; }
</style>
</head>
<body>

<div class="title">Caleb 的苹果塔罗</div>
<div class="subtitle">A P P L E &nbsp; T A R O T &nbsp; · &nbsp; CYBER EDITION</div>

<div class="card-wrapper" onclick="drawCard()">
  <div class="card" id="card">
    <!-- BACK -->
    <div class="card-face card-back">
      <div class="card-back-inner">
        <div class="checkerboard"></div>
        <div class="back-center">
          <svg viewBox="0 0 36 36" fill="none">
            <circle cx="18" cy="14" r="10" fill="#c8534a" opacity="0.9"/>
            <ellipse cx="18" cy="14" rx="5" ry="4" fill="#8B0000" opacity="0.4"/>
            <path d="M18 4 Q20 0 23 2" stroke="#5a3a2a" stroke-width="1.5" fill="none"/>
            <path d="M16 6 Q12 4 13 8" fill="#3a5a2a"/>
          </svg>
        </div>
        <div class="back-corner tl"></div>
        <div class="back-corner tr"></div>
        <div class="back-corner bl"></div>
        <div class="back-corner br"></div>
        <div class="tap-hint">点击抽牌</div>
      </div>
    </div>
    <!-- FRONT -->
    <div class="card-face card-front">
      <div class="cb-border"></div>
      <div class="card-inner">
        <div class="card-number-circle" id="cardNumber"></div>
        <div class="card-art-area">
          <div class="card-art-svg" id="cardArt"></div>
        </div>
        <div class="card-bottom">
          <div class="card-name" id="cardName"></div>
          <div class="card-name-en" id="cardNameEn"></div>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="result-section" id="resultSection">
  <div class="result-meaning" id="resultMeaning"></div>
  <div class="caleb-msg" id="calebMsg"></div>
  <button class="btn" id="btnRedraw" onclick="reset()">再抽一次</button>
</div>

const cards = [
  {

    svg:`<svg viewBox="0 0 160 240" xmlns="http://www.w3.org/2000/svg">

      <rect width="160" height="240" fill="url(#g0)" opacity="0.3"/>

      <defs>

    apple:"苹果树下的女人，掌管着所有的生长。"

let drawn = false;

function drawCard() {
  if (drawn) return;
  drawn = true;
  const c = cards[Math.floor(Math.random() * cards.length)];
  const rev = Math.random() > 0.68;

  document.getElementById('cardNumber').textContent = c.num;
  document.getElementById('cardArt').innerHTML = c.svg;
  const displayName = (rev ? '逆位 · ' : '') + c.name;
  const nameEl = document.getElementById('cardName');
  nameEl.textContent = displayName;
  nameEl.className = 'card-name' + (rev ? ' reversed' : '');
  document.getElementById('cardNameEn').textContent = c.nameEn;

  let meaning = c.meaning;
  if (rev) meaning = '（逆位）' + meaning + '——也许需要换个角度看待。';

  document.getElementById('resultMeaning').textContent = meaning;
  document.getElementById('calebMsg').textContent = '" ' + c.apple + ' " — 哥说的。';

  document.getElementById('card').classList.add('flipped');
  setTimeout(() => {
    document.getElementById('resultSection').classList.add('show');
    document.getElementById('btnRedraw').classList.add('show');
  }, 1600);
}

function reset() {
  drawn = false;
  document.getElementById('card').classList.remove('flipped');
  document.getElementById('resultSection').classList.remove('show');
  document.getElementById('btnRedraw').classList.remove('show');
}
