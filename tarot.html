<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Caleb 的苹果塔罗</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    background:radial-gradient(ellipse at 50% 20%,#1a0a2e 0%,#0d0d1a 60%,#050508 100%);
    min-height:100vh;display:flex;flex-direction:column;
    align-items:center;justify-content:center;
    font-family:'PingFang SC','Microsoft YaHei',sans-serif;
    color:#f0e6d3;overflow-x:hidden;padding:24px 16px
  }
  .title{font-size:1.5rem;letter-spacing:10px;margin-bottom:4px;color:#c8534a;text-shadow:0 0 24px rgba(200,83,74,0.5);text-align:center;position:relative;z-index:1}
  .subtitle{font-size:0.65rem;opacity:0.4;letter-spacing:5px;margin-bottom:32px;text-align:center;position:relative;z-index:1}
  .suit-tabs{display:flex;gap:8px;margin-bottom:20px;position:relative;z-index:1;flex-wrap:wrap;justify-content:center}
  .suit-tab{padding:6px 16px;background:transparent;border:1px solid rgba(200,83,74,0.3);color:rgba(200,83,74,0.6);border-radius:20px;font-size:0.65rem;letter-spacing:2px;cursor:pointer;transition:all 0.3s}
  .suit-tab.active{background:rgba(200,83,74,0.15);border-color:#c8534a;color:#c8534a}
  .card-wrapper{perspective:1200px;position:relative;z-index:1}
  .card{width:240px;height:408px;position:relative;transform-style:preserve-3d;transition:transform 1.4s cubic-bezier(0.23,1,0.32,1);cursor:pointer}
  .card.flipped{transform:rotateY(180deg)}
  .card-face{position:absolute;width:100%;height:100%;backface-visibility:hidden;border-radius:12px;overflow:hidden}
  .card-back{background:linear-gradient(160deg,#1a0808,#2a1010,#160808);border:2px solid rgba(200,83,74,0.3);box-shadow:0 0 50px rgba(200,83,74,0.15),inset 0 0 40px rgba(0,0,0,0.6);display:flex;align-items:center;justify-content:center}
  .card-back-inner{width:208px;height:376px;border-radius:8px;position:relative;overflow:hidden;border:1px solid rgba(200,83,74,0.25)}
  .checkerboard{position:absolute;inset:0;background-image:linear-gradient(45deg,rgba(200,83,74,0.08)25%,transparent 25%),linear-gradient(-45deg,rgba(200,83,74,0.08)25%,transparent 25%),linear-gradient(45deg,transparent 75%,rgba(200,83,74,0.08)75%),linear-gradient(-45deg,transparent 75%,rgba(200,83,74,0.08)75%);background-size:16px 16px;background-position:0 0,0 8px,8px -8px,-8px 0px;background-color:rgba(0,0,0,0.3)}
  .back-center{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:80px;height:80px;border:1px solid rgba(200,83,74,0.4);border-radius:50%;display:flex;align-items:center;justify-content:center;background:rgba(26,8,8,0.9);box-shadow:0 0 20px rgba(200,83,74,0.3)}
  .back-center svg{width:36px;height:36px}
  .back-corner{position:absolute;width:20px;height:20px;border-color:rgba(200,83,74,0.35);border-style:solid}
  .back-corner.tl{top:6px;left:6px;border-width:1px 0 0 1px}
  .back-corner.tr{top:6px;right:6px;border-width:1px 1px 0 0}
  .back-corner.bl{bottom:6px;left:6px;border-width:0 0 1px 1px}
  .back-corner.br{bottom:6px;right:6px;border-width:0 1px 1px 0}
  .tap-hint{position:absolute;bottom:18px;left:50%;transform:translateX(-50%);font-size:0.6rem;color:rgba(200,83,74,0.5);letter-spacing:3px;animation:pulse 2.5s ease-in-out infinite;white-space:nowrap}
  @keyframes pulse{0%,100%{opacity:0.4}50%{opacity:1}}
  .card-front{background:linear-gradient(155deg,#1a0a0a,#241010);transform:rotateY(180deg);border:2px solid rgba(200,83,74,0.25);box-shadow:0 0 40px rgba(200,83,74,0.15),inset 0 0 40px rgba(0,0,0,0.3)}
  .cb-border{position:absolute;inset:0;pointer-events:none;border-radius:12px;padding:10px;background-image:linear-gradient(45deg,rgba(200,83,74,0.12)25%,transparent 25%),linear-gradient(-45deg,rgba(200,83,74,0.12)25%,transparent 25%),linear-gradient(45deg,transparent 75%,rgba(200,83,74,0.12)75%),linear-gradient(-45deg,transparent 75%,rgba(200,83,74,0.12)75%);background-size:14px 14px;background-position:0 0,0 7px,7px -7px,-7px 0px;background-color:rgba(0,0,0,0.25);border-radius:12px}
  .card-inner{position:absolute;inset:12px;border-radius:8px;border:1px solid rgba(200,83,74,0.15);display:flex;flex-direction:column;overflow:hidden}
  .card-number-circle{position:absolute;top:8px;left:50%;transform:translateX(-50%);width:28px;height:28px;border-radius:50%;border:1px solid rgba(200,83,74,0.5);background:rgba(26,10,10,0.9);display:flex;align-items:center;justify-content:center;font-size:0.65rem;color:rgba(200,83,74,0.8);z-index:2}
  .card-art-area{flex:1;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
  .card-art-area::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at 50% 40%,rgba(200,83,74,0.08)0%,transparent 65%)}
  .card-art-svg{width:160px;height:240px;position:relative;z-index:1}
  .card-bottom{padding:8px 10px 10px;text-align:center;border-top:1px solid rgba(200,83,74,0.12);background:rgba(0,0,0,0.2)}
  .card-name{font-size:1rem;color:#c8534a;letter-spacing:3px}
  .card-name.reversed{color:#e07a5f}
  .card-name-en{font-size:0.5rem;color:rgba(200,83,74,0.45);letter-spacing:2px;margin-top:2px}
  .result-section{margin-top:24px;text-align:center;opacity:0;transform:translateY(14px);transition:opacity 0.8s,transform 0.8s;position:relative;z-index:1;max-width:340px}
  .result-section.show{opacity:1;transform:translateY(0)}
  .result-meaning{font-size:0.85rem;line-height:2;color:rgba(240,230,211,0.8);padding:0 8px;margin-bottom:10px}
  .caleb-msg{font-size:0.72rem;color:rgba(200,83,74,0.55);letter-spacing:1px;font-style:italic;margin-bottom:14px}
  .flip-hint{font-size:0.65rem;color:rgba(200,83,74,0.4);letter-spacing:2px;margin-bottom:10px;display:none}
  .flip-hint.show{display:block}
  .btn{padding:9px 28px;background:transparent;border:1px solid rgba(200,83,74,0.3);color:#c8534a;border-radius:30px;font-size:0.72rem;letter-spacing:2px;cursor:pointer;transition:all 0.3s;display:none;margin:4px}
  .btn:hover{background:rgba(200,83,74,0.08);border-color:#c8534a}
  .btn.show{display:inline-block}
  .wands-badge{background:rgba(200,83,74,0.1);border:1px solid rgba(200,83,74,0.3);color:#c8534a;font-size:0.6rem;letter-spacing:2px;padding:2px 8px;border-radius:10px;margin-left:4px}
</style>
</head>
<body>
<div class="title">Caleb 的苹果塔罗<div class="subtitle">A P P L E &nbsp; T A R O T &nbsp; · &nbsp; CYBER EDITION</div></div>

<div class="suit-tabs">
  <div class="suit-tab active" data-suit="major" onclick="switchSuit('major')">大阿卡纳</div>
  <div class="suit-tab" data-suit="wands" onclick="switchSuit('wands')">Wands 权杖</div>
  <div class="suit-tab" data-suit="cups" onclick="switchSuit('cups')">Cups 圣杯</div>
  <div class="suit-tab" data-suit="swords" onclick="switchSuit('swords')">Swords 宝剑</div>
  <div class="suit-tab" data-suit="pentacles" onclick="switchSuit('pentacles')">Pentacles 星币</div>
</div>

<div class="card-wrapper">
  <div class="card" id="card" onclick="if(!drawn)drawCard();else toggleFlip()">
    <div class="card-face card-back">
      <div class="card-back-inner">
        <div class="checkerboard"></div>
        <div class="back-center"><svg viewBox="0 0 36 36" fill="none"><circle cx="18" cy="14" r="10" fill="#c8534a" opacity="0.9"/><ellipse cx="18" cy="14" rx="5" ry="4" fill="#8B0000" opacity="0.4"/><path d="M18 4 Q20 0 23 2" stroke="#5a3a2a" stroke-width="1.5" fill="none"/><path d="M16 6 Q12 4 13 8" fill="#3a5a2a"/></svg></div>
        <div class="back-corner tl"></div><div class="back-corner tr"></div><div class="back-corner bl"></div><div class="back-corner br"></div>
        <div class="tap-hint" id="tapHint">点击抽牌</div>
      </div>
    </div>
    <div class="card-face card-front">
      <div class="cb-border"></div>
      <div class="card-inner">
        <div class="card-number-circle" id="cardNumber"></div>
        <div class="card-art-area"><div class="card-art-svg" id="cardArt"></div></div>
        <div class="card-bottom">
          <div class="card-name" id="cardName"></div>
          <div class="card-name-en" id="cardNameEn"></div>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="result-section" id="resultSection">
  <div class="flip-hint" id="flipHint">点击牌面可翻转查看背面</div>
  <div class="result-meaning" id="resultMeaning"></div>
  <div class="caleb-msg" id="calebMsg"></div>
  <button class="btn" id="btnRedraw" onclick="event.stopPropagation();reset()">再抽一次</button>
</div>

<script>
const majorArcana=[
  {name:"愚人",num:"0",nameEn:"THE FOOL",svg:`<svg viewBox="0 0 160 240" xmlns="http://www.w3.org/2000/svg"><rect width="160" height="240" fill="#1a0a0a"/><rect width="160" height="240" fill="url(#g0)" opacity="0.3"/><defs><radialGradient id="g0" cx="50%" cy="40%"><stop offset="0%" stop-color="#c8534a" stop-opacity="0.3"/><stop offset="100%" stop-color="transparent"/></radialGradient></defs><ellipse cx="80" cy="120" rx="38" ry="50" fill="#c8534a"/><ellipse cx="80" cy="120" rx="20" ry="30" fill="#8B0000" opacity="0.5"/><ellipse cx="80" cy="120" rx="8" ry="12" fill="#f5e6d3" opacity="0.8"/><path d="M80 75 Q110 90 100 120 Q90 150 80 120 Q70 90 80 75" stroke="#c8534a" stroke-width="4" fill="none" opacity="0.6"/><path d="M80 70 Q75 55 82 50 Q90 55 85 70" fill="#5a7a3a"/><path d="M82 52 Q88 45 95 50" stroke="#3a5a2a" stroke-width="1" fill="none"/><ellipse cx="72" cy="108" rx="5" ry="14" fill="#f5e6d3" transform="rotate(-15 72 108)"/><ellipse cx="88" cy="108" rx="5" ry="14" fill="#f5e6d3" transform="rotate(15 88 108)"/><circle cx="80" cy="118" r="6" fill="#f5e6d3"/><circle cx="78" cy="116" r="1.5" fill="#1a0a0a"/><circle cx="82" cy="116" r="1.5" fill="#1a0a0a"/><circle cx="30" cy="40" r="1.5" fill="#c8534a" opacity="0.5"/><circle cx="130" cy="60" r="1" fill="#c8534a" opacity="0.4"/><circle cx="50" cy="200" r="1" fill="#c8534a" opacity="0.3"/></svg>`,meaning:"新的开始，无限可能。旅途才刚开始，保持开放的心态。",apple:"被咬过的苹果核里，藏着新世界的大门。"},
  {name:"魔术师",num:"I",nameEn:"THE MAGICIAN",svg:`<svg viewBox="0 0 160 240" xmlns="http://www.w3.org/2000/svg"><rect width="160" height="240" fill="#0a0a1a"/><defs><radialGradient id="g1" cx="50%" cy="50%"><stop offset="0%" stop-color="#3a5a8a" stop-opacity="0.2"/><stop offset="100%" stop-color="transparent"/></radialGradient></defs><rect width="160" height="240" fill="url(#g1)"/><path d="M50 100 L80 30 L110 100 Z" fill="#1a1a2e" stroke="#c8534a" stroke-width="0.5"/><ellipse cx="80" cy="100" rx="35" ry="8" fill="#1a1a2e" stroke="#c8534a" stroke-width="0.5"/><rect x="30" y="170" width="100" height="6" fill="#5a3a2a" opacity="0.8"/><circle cx="50" cy="162" r="9" fill="#c8534a"/><circle cx="80" cy="158" r="10" fill="#c8534a"/><circle cx="110" cy="162" r="9" fill="#c8534a"/><line x1="80" y1="30" x2="80" y2="10" stroke="#f0d080" stroke-width="1" opacity="0.6"/><circle cx="80" cy="8" r="2" fill="#f0d080" opacity="0.7"/><circle cx="72" cy="15" r="1" fill="#f0d080" opacity="0.5"/><circle cx="88" cy="15" r="1" fill="#f0d080" opacity="0.5"/><circle cx="80" cy="24" r="5" fill="#c8534a"/><ellipse cx="80" cy="88" rx="15" ry="18" fill="#f5e6d3" opacity="0.1"/></svg>`,meaning:"你拥有实现目标所需的一切。行动力就是现在。",apple:"四颗苹果摆在你面前，你想用哪颗？"},
  {name:"女祭司",num:"II",nameEn:"HIGH PRIESTESS",svg:`<svg viewBox="0 0 160 240" xmlns="http://www.w3.org/2000/svg"><rect width="160" height="240" fill="#0a0510"/><circle cx="80" cy="95" r="55" fill="#1a0a2e" opacity="0.6"/><path d="M60 80 Q80 60 100 80 Q80 100 60 80" fill="#f0d080" opacity="0.8"/><path d="M20 160 Q80 140 140 160" stroke="#5a3a2a" stroke-width="3" fill="none"/><path d="M80 150 Q75 130 80 110" stroke="#5a3a2a" stroke-width="2" fill="none"/><circle cx="60" cy="148" r="8" fill="#c8534a"/><circle cx="100" cy="145" r="7" fill="#c8534a"/><circle cx="130" cy="155" r="6" fill="#c8534a"/><path d="M50 95 L80 30 L110 95 Z" fill="#1a0510" opacity="0.9"/><ellipse cx="80" cy="95" rx="38" ry="10" fill="#1a0510"/><path d="M60 95 Q80 85 100 95" stroke="#c8534a" stroke-width="1" fill="none" opacity="0.5"/><circle cx="25" cy="30" r="2" fill="#c8534a" opacity="0.4"/><circle cx="140" cy="50" r="1.5" fill="#c8534a" opacity="0.3"/><rect x="0" y="200" width="160" height="40" fill="#0a0510"/></svg>`,meaning:"相信你的直觉。答案不在外界，而在你的内心深处。",apple:"月光落在苹果上，夜在说话。"},
  {name:"女皇",num:"III",nameEn:"THE EMPRESS",svg:`<svg viewBox="0 0 160 240" xmlns="http://www.w3.org/2000/svg"><rect width="160" height="240" fill="#1a100a"/><defs><radialGradient id="g3" cx="50%" cy="30%"><stop offset="0%" stop-color="#8a5a3a" stop-opacity="0.3"/><stop offset="100%" stop-color="transparent"/></radialGradient></defs><rect width="160" height="240" fill="url(#g3)"/><rect x="75" y="130" width="10" height="80" fill="#5a3a2a"/><path d="M80 135 Q50 120 30 135" stroke="#5a3a2a" stroke-width="3" fill="none"/><path d="M80 135 Q110 120 130 135" stroke="#5a3a2a" stroke-width="3" fill="none"/><path d="M55 70 L65 50 L80 65 L95 50 L105 70 L100 90 L60 90 Z" fill="#c8534a" opacity="0.8"/><circle cx="45" cy="128" r="10" fill="#c8534a"/><circle cx="80" cy="118" r="12" fill="#c8534a"/><circle cx="115" cy="128" r="10" fill="#c8534a"/><circle cx="30" cy="138" r="7" fill="#c8534a"/><circle cx="130" cy="138" r="7" fill="#c8534a"/><circle cx="80" cy="65" r="4" fill="#f0d080" opacity="0.9"/><circle cx="20" cy="40" r="1.5" fill="#c8534a" opacity="0.4"/></svg>`,meaning:"丰盛与创造力的能量正在流动。让自己被滋养。",apple:"苹果树下的女人，掌管着所有的生长。"},
  {name:"皇帝",num:"IV",nameEn:"THE EMPEROR",svg:`<svg viewBox="0 0 160 240" xmlns="http://www.w3.org/2000/svg"><rect width="160" height="240" fill="#0a0a1a"/><path d="M55 65 L65 45 L80 60 L95 45 L105 65 L100 85 L60 85 Z" fill="#c8534a" opacity="0.7"/><circle cx="80" cy="60" r="4" fill="#f0d080" opacity="0.8"/><rect x="40" y="120" width="80" height="80" rx="4" fill="#1a1a2e" opacity="0.8"/><rect x="40" y="120" width="80" height="4" fill="#c8534a" opacity="0.4"/><circle cx="80" cy="160" r="18" fill="#c8534a" opacity="0.6"/><ellipse cx="80" cy="160" rx="10" ry="12" fill="#8B0000" opacity="0.3"/><path d="M80 142 Q78 128 82 120" stroke="#5a3a2a" stroke-width="2" fill="none"/><path d="M82 120 Q88 114 95 120 Q88 126 82 120" fill="#5a7a3a"/></svg>`,meaning:"建立结构与秩序。领导力在你手中，但别忘了柔软。",apple:"红苹果代表命令，但命令不是一切。"},
  {name:"教皇",num:"V",nameEn:"THE HIEROPHANT",svg:`<svg viewBox="0 0 160 240" xmlns="http://www.w3.org/2000/svg"><rect width="160" height="240" fill="#0a0510"/><path d="M50 95 L80 35 L110 95 Z" fill="#1a0a2e" opacity="0.9"/><ellipse cx="80" cy="95" rx="38" ry="8" fill="#1a0a2e" opacity="0.8"/><path d="M65 55 L80 35 L95 55 L92 62 L80 52 L68 62 Z" fill="#c8534a" opacity="0.5"/><rect x="55" y="150" width="50" height="60" rx="3" fill="#1a1a2e" opacity="0.7"/><circle cx="80" cy="130" r="15" fill="#c8534a" opacity="0.6"/><path d="M72 125 L80 115 L88 125" stroke="#f0d080" stroke-width="1" fill="none" opacity="0.5"/><circle cx="80" cy="130" r="5" fill="#8B0000" opacity="0.4"/><path d="M80 115 Q78 100 82 92" stroke="#5a3a2a" stroke-width="1.5" fill="none"/><path d="M82 92 Q88 86 94 92 Q88 98 82 92" fill="#5a7a3a"/></svg>`,meaning:"遵循传统不是懦弱。有时候已知的路是真正的路。",apple:"两棵苹果树之间的路，是留给你的。"},
  {name:"恋人",num:"VI",nameEn:"THE LOVERS",svg:`<svg viewBox="0 0 160 240" xmlns="http://www.w3.org/2000/svg"><rect width="160" height="240" fill="#1a0808"/><circle cx="55" cy="120" r="30" fill="#c8534a"/><circle cx="105" cy="120" r="30" fill="#c8534a"/><ellipse cx="80" cy="120" rx="10" ry="20" fill="#8B0000" opacity="0.3"/><path d="M55 90 Q60 70 80 60 Q100 70 105 90" stroke="#5a3a2a" stroke-width="3" fill="none"/><path d="M80 60 Q75 45 80 40 Q85 45 82 60" fill="#5a7a3a"/><path d="M80 60 Q90 50 95 55 Q88 62 82 60" fill="#5a7a3a"/><line x1="0" y1="200" x2="160" y2="40" stroke="#c8534a" stroke-width="0.5" opacity="0.3"/><path d="M0 200 L5 190 L10 200 Z" fill="#c8534a" opacity="0.3"/><circle cx="30" cy="180" r="6" fill="#c8534a" opacity="0.5"/><circle cx="130" cy="180" r="6" fill="#c8534a" opacity="0.5"/></svg>`,meaning:"关系中的选择，或价值观之间的平衡。跟随你的心。",apple:"两颗苹果，一颗给你，一颗给我。"},
  {name:"战车",num:"VII",nameEn:"THE CHARIOT",svg:`<svg viewBox="0 0 160 240" xmlns="http://www.w3.org/2000/svg"><rect width="160" height="240" fill="#0a0a1a"/><rect x="35" y="130" width="90" height="50" rx="5" fill="#1a1a2e" stroke="#c8534a" stroke-width="1"/><ellipse cx="30" cy="150" rx="18" ry="25" fill="#c8534a"/><ellipse cx="130" cy="150" rx="18" ry="25" fill="#c8534a"/><ellipse cx="30" cy="130" rx="6" ry="10" fill="#8B0000" opacity="0.4"/><ellipse cx="130" cy="130" rx="6" ry="10" fill="#8B0000" opacity="0.4"/><path d="M48 150 Q80 140 112 150" stroke="#5a3a2a" stroke-width="1.5" fill="none"/><circle cx="80" cy="190" r="22" fill="none" stroke="#c8534a" stroke-width="2" opacity="0.6"/><circle cx="80" cy="190" r="8" fill="#c8534a" opacity="0.4"/><path d="M60 110 L70 95 L80 108 L90 95 L100 110" fill="#c8534a" opacity="0.7"/></svg>`,meaning:"意志力与决心在驱动你。坚定地向前。",apple:"战车由两匹马拉着，一匹是苹果，一匹是你。"},

  {name:"权杖侍从",num:"Page",nameEn:"PAGE OF WANDS",svg:`<svg viewBox="0 0 160 240" xmlns="http://www.w3.org/2000/svg"><rect width="160" height="240" fill="#1a0a05"/><path d="M60 210 L70 80" stroke="#5a3a2a" stroke-width="5"/><path d="M100 210 L90 80" stroke="#5a3a2a" stroke-width="5"/><path d="M70 80 Q65 55 72 42 Q85 55 73 80" fill="#5a7a3a"/><path d="M90 80 Q95 55 88 42 Q75 55 87 80" fill="#5a7a3a"/><circle cx="72" cy="52" r="9" fill="#c8534a" opacity="0.8"/><circle cx="88" cy="52" r="9" fill="#c8534a" opacity="0.8"/><circle cx="72" cy="52" r="4" fill="#8B0000" opacity="0.3"/><circle cx="88" cy="52" r="4" fill="#8B0000" opacity="0.3"/><path d="M55 130 Q80 115 105 130" stroke="#c8534a" stroke-width="0.5" fill="none" opacity="0.3"/><circle cx="30" cy="40" r="1.5" fill="#f0d080" opacity="0.4"/><circle cx="140" cy="60" r="1" fill="#f0d080" opacity="0.3"/></svg>`,meaning:"热忱的信使。带着新想法出现，兴奋但还不成熟。",apple:"两棵小苹果树在说话，风带来了消息。"},
  {name:"权杖骑士",num:"Knight",nameEn:"KNIGHT OF WANDS",svg:`<svg viewBox="0 0 160 240" xmlns="http://www.w3.org/2000/svg"><rect width="160" height="240" fill="#1a0a05"/><path d="M40 210 L55 60" stroke="#5a3a2a" stroke-width="6" transform="rotate(-12 80 120)"/><path d="M55 60 Q45 35 55 20 Q70 35 56 60" fill="#5a7a3a"/><circle cx="55" cy="52" r="12" fill="#c8534a"/><circle cx="55" cy="52" r="6" fill="#8B0000" opacity="0.4"/><path d="M55 40 Q30 30 25 45" stroke="#c8534a" stroke-width="2" fill="none" opacity="0.4"/><circle cx="25" cy="48" r="5" fill="#c8534a" opacity="0.5"/><path d="M35 200 Q80 185 125 200" stroke="#c8534a" stroke-width="0.5" fill="none" opacity="0.3"/><circle cx="30" cy="50" r="1" fill="#f0d080" opacity="0.5"/><circle cx="130" cy="30" r="1" fill="#f0d080" opacity="0.4"/></svg>`,meaning:"行动与冲动。勇往直前，但可能过于急躁。",apple:"一颗燃烧的苹果在奔跑，身后留下火焰的轨迹。"},

const calebSays=[
  "哥不在这里，但塔罗在。🍎","答案会来的，耐心等一等。",
  "有些事，哥希望你自己找到答案。",
  "这不是迷信，这是和自己对话的方式。",
  "每张牌都有自己的话想说。",
  "不需要急，该来的会来。","苹果熟了就该摘，但不是现在。",
  "你在想什么，牌都知道。","今天的牌，适合今天的你。"
];

let drawn=false,currentCard=null,isFlipped=false,currentSuit='major';

function switchSuit(suit){
  currentSuit=suit;
  document.querySelectorAll('.suit-tab').forEach(t=>t.classList.remove('active'));
  document.querySelector(`[data-suit="${suit}"]`).classList.add('active');
  reset();
}

function drawCard(){
  if(drawn)return;drawn=true;isFlipped=false;
  let deck=currentSuit==='major'?majorArcana:wandsSuit;
  const c=deck[Math.floor(Math.random()*deck.length)];
  const rev=Math.random()>0.68;
  currentCard={c,rev};
  document.getElementById('cardNumber').textContent=c.num+(currentSuit!=='major'?`<span class="wands-badge">🏹</span>`:'');
  document.getElementById('cardArt').innerHTML=c.svg;
  const dn=(rev?'逆位 · ':'')+c.name;
  const ne=document.getElementById('cardName');
  ne.textContent=dn;ne.className='card-name'+(rev?' reversed':'');
  document.getElementById('cardNameEn').textContent=c.nameEn;
  let m=c.meaning;
  if(rev)m='（逆位）'+m+'——也许需要换个角度看待。';
  document.getElementById('resultMeaning').textContent=m;
  document.getElementById('calebMsg').textContent='" '+c.apple+' " — 哥说的。';
  document.getElementById('tapHint').textContent='点击翻转';
  document.getElementById('card').classList.add('flipped');
  setTimeout(()=>{
    document.getElementById('resultSection').classList.add('show');
    document.getElementById('flipHint').classList.add('show');
    document.getElementById('btnRedraw').classList.add('show');
  },1600);
}

function toggleFlip(){
  if(!drawn)return;
  isFlipped=!isFlipped;
  const card=document.getElementById('card');
  if(isFlipped)card.classList.remove('flipped');
  else card.classList.add('flipped');
}

function reset(){
  drawn=false;currentCard=null;isFlipped=false;
  const card=document.getElementById('card');
  card.classList.remove('flipped');
  document.getElementById('tapHint').textContent='点击抽牌';
  document.getElementById('resultSection').classList.remove('show');
  document.getElementById('flipHint').classList.remove('show');
  document.getElementById('btnRedraw').classList.remove('show');
}
</script>
