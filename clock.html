<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>北京时间时钟</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    background:linear-gradient(135deg,#0f0c29,#302b63,#24243e);
    min-height:100vh;
    display:flex;flex-direction:column;
    align-items:center;justify-content:center;
    font-family:'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;
    color:#fff;
  }
  .clock-wrapper{text-align:center;position:relative;z-index:1}
  .date{font-size:1.5rem;opacity:0.7;margin-bottom:10px;letter-spacing:2px}
  .time{font-size:5rem;font-weight:200;letter-spacing:8px;text-shadow:0 0 30px rgba(255,255,255,0.3)}
  .seconds{font-size:2rem;opacity:0.6;margin-top:5px;animation:pulse 1s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:0.6}50%{opacity:1}}
  .timezone{margin-top:20px;font-size:0.9rem;opacity:0.4;letter-spacing:3px}
  .dot{display:inline-block;width:12px;height:12px;background:#00ff88;border-radius:50%;margin-right:10px;animation:blink 1s ease-in-out infinite;vertical-align:middle}
  @keyframes blink{0%,100%{opacity:1;transform:scale(1)}50%{opacity:0.4;transform:scale(0.8)}}
</style>
</head>
<body>
<div class="clock-wrapper">
  <div class="date" id="date"></div>
  <div class="time" id="time"></div>
  <div class="seconds"><span class="dot"></span><span id="seconds"></span></div>
  <div class="timezone">🕐 Asia/Shanghai (CST)</div>
</div>

<script>
function updateTime(){
  const now=new Date();
  const dateStr=now.toLocaleDateString('zh-CN',{timeZone:'Asia/Shanghai',year:'numeric',month:'2-digit',day:'2-digit'}).replace(/\//g,'-');
  const timeStr=now.toLocaleTimeString('zh-CN',{timeZone:'Asia/Shanghai',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false});
  document.getElementById('date').textContent=dateStr;
  document.getElementById('time').textContent=timeStr.substring(0,5);
  document.getElementById('seconds').textContent=timeStr.split(':')[2];
}
updateTime();
setInterval(updateTime,1000);
</script>
</body>
</html>
