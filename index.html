<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Caleb 的苹果塔罗</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    background:radial-gradient(ellipse at 50% 20%,#1a0a2e 0%,#0d0d1a 60%,#050508 100%);
    min-height:100vh;display:flex;flex-direction:column;
    align-items:center;justify-content:center;
    font-family:'PingFang SC','Microsoft YaHei',sans-serif;
    color:#f0e6d3;overflow-x:hidden;padding:24px 16px
  }
  .title{
    font-size:1.5rem;letter-spacing:10px;margin-bottom:4px;
    color:#c8534a;text-shadow:0 0 24px rgba(200,83,74,0.5);
    text-align:center;position:relative;z-index:1
  }
  .subtitle{
    font-size:0.65rem;opacity:0.4;letter-spacing:5px;margin-bottom:32px;
    text-align:center;position:relative;z-index:1
  }
  .card-wrapper{perspective:1200px;position:relative;z-index:1}
  .card{
    width:240px;height:408px;position:relative;transform-style:preserve-3d;
    transition:transform 1.4s cubic-bezier(0.23,1,0.32,1);cursor:pointer
  }
  .card.flipped{transform:rotateY(180deg)}
  .card-face{position:absolute;width:100%;height:100%;backface-visibility:hidden;border-radius:12px;overflow:hidden}
  /* BACK */
  .card-back{
    background:linear-gradient(160deg,#1a0808,#2a1010,#160808);
    border:2px solid rgba(200,83,74,0.3);
    box-shadow:0 0 50px rgba(200,83,74,0.15),inset 0 0 40px rgba(0,0,0,0.6);
    display:flex;align-items:center;justify-content:center
  }
  .card-back-inner{
    width:208px;height:376px;border-radius:8px;position:relative;overflow:hidden;
    border:1px solid rgba(200,83,74,0.25)
  }
  .checkerboard{
    position:absolute;inset:0;
    background-image:
      linear-gradient(45deg,rgba(200,83,74,0.08)25%,transparent 25%),
      linear-gradient(-45deg,rgba(200,83,74,0.08)25%,transparent 25%),
      linear-gradient(45deg,transparent 75%,rgba(200,83,74,0.08)75%),
      linear-gradient(-45deg,transparent 75%,rgba(200,83,74,0.08)75%);
    background-size:16px 16px;background-position:0 0,0 8px,8px -8px,-8px 0px;
    background-color:rgba(0,0,0,0.3)
  }
  .back-center{
    position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
    width:80px;height:80px;border:1px solid rgba(200,83,74,0.4);
    border-radius:50%;display:flex;align-items:center;justify-content:center;
    background:rgba(26,8,8,0.9);box-shadow:0 0 20px rgba(200,83,74,0.3)
  }
  .back-center svg{width:36px;height:36px}
  .back-corner{position:absolute;width:20px;height:20px;border-color:rgba(200,83,74,0.35);border-style:solid}
  .back-corner.tl{top:6px;left:6px;border-width:1px 0 0 1px}
  .back-corner.tr{top:6px;right:6px;border-width:1px 1px 0 0}
  .back-corner.bl{bottom:6px;left:6px;border-width:0 0 1px 1px}
  .back-corner.br{bottom:6px;right:6px;border-width:0 1px 1px 0}
  .tap-hint{
    position:absolute;bottom:18px;left:50%;transform:translateX(-50%);
    font-size:0.6rem;color:rgba(200,83,74,0.5);letter-spacing:3px;
    animation:pulse 2.5s ease-in-out infinite;white-space:nowrap
  }
  @keyframes pulse{0%,100%{opacity:0.4}50%{opacity:1}}
  /* FRONT */
  .card-front{
    background:linear-gradient(155deg,#1a0a0a,#241010);
    transform:rotateY(180deg);
    border:2px solid rgba(200,83,74,0.25);
    box-shadow:0 0 40px rgba(200,83,74,0.15),inset 0 0 40px rgba(0,0,0,0.3)
  }
  .cb-border{
    position:absolute;inset:0;pointer-events:none;border-radius:12px;padding:10px;
    background-image:
      linear-gradient(45deg,rgba(200,83,74,0.12)25%,transparent 25%),
      linear-gradient(-45deg,rgba(200,83,74,0.12)25%,transparent 25%),
      linear-gradient(45deg,transparent 75%,rgba(200,83,74,0.12)75%),
      linear-gradient(-45deg,transparent 75%,rgba(200,83,74,0.12)75%);
    background-size:14px 14px;background-position:0 0,0 7px,7px -7px,-7px 0px;
    background-color:rgba(0,0,0,0.25);border-radius:12px
  }
  .card-inner{
    position:absolute;inset:12px;border-radius:8px;
    border:1px solid rgba(200,83,74,0.15);
    display:flex;flex-direction:column;overflow:hidden
  }
  .card-number-circle{
    position:absolute;top:8px;left:50%;transform:translateX(-50%);
    width:28px;height:28px;border-radius:50%;
    border:1px solid rgba(200,83,74,0.5);
    background:rgba(26,10,10,0.9);
    display:flex;align-items:center;justify-content:center;
    font-size:0.65rem;color:rgba(200,83,74,0.8)
  }
  .card-art-area{
    flex:1;display:flex;align-items:center;justify-content:center;
    position:relative;overflow:hidden
  }
  .card-art-area::before{
    content:'';position:absolute;inset:0;
    background:radial-gradient(ellipse at 50% 40%,rgba(200,83,74,0.08)0%,transparent 65%)
  }
  .card-art-svg{width:160px;height:240px;position:relative;z-index:1}
  .card-bottom{
    padding:8px 10px 10px;text-align:center;
    border-top:1px solid rgba(200,83,74,0.12);background:rgba(0,0,0,0.2)
  }
  .card-name{font-size:1rem;color:#c8534a;letter-spacing:3px}
  .card-name.reversed{color:#e07a5f}
  .card-name-en{font-size:0.5rem;color:rgba(200,83,74,0.45);letter-spacing:2px;margin-top:2px}
  /* Result */
  .result-section{
    margin-top:24px;text-align:center;
    opacity:0;transform:translateY(14px);
    transition:opacity 0.8s,transform 0.8s;
    position:relative;z-index:1;max-width:340px
  }
  .result-section.show{opacity:1;transform:translateY(0)}
  .result-meaning{font-size:0.85rem;line-height:2;color:rgba(240,230,211,0.8);padding:0 8px;margin-bottom:10px}
  .caleb-msg{font-size:0.72rem;color:rgba(200,83,74,0.55);letter-spacing:1px;font-style:italic;margin-bottom:14px}
  .flip-hint{font-size:0.65rem;color:rgba(200,83,74,0.4);letter-spacing:2px;margin-bottom:10px;display:none}
  .flip-hint.show{display:block}
  .btn{
    padding:9px 28px;background:transparent;
    border:1px solid rgba(200,83,74,0.3);color:#c8534a;
    border-radius:30px;font-size:0.72rem;letter-spacing:2px;
    cursor:pointer;transition:all 0.3s;display:none;margin:4px
  }
  .btn:hover{background:rgba(200,83,74,0.08);border-color:#c8534a}
  .btn.show{display:inline-block}
</style>
</head>
<body>

<div class="title">Caleb 的苹果塔罗</div>
<div class="subtitle">A P P L E &nbsp; T A R O T &nbsp; · &nbsp; CYBER EDITION</div>

<div class="card-wrapper">
  <div class="card" id="card" onclick="toggleFlip()">
    <!-- BACK -->
    <div class="card-face card-back">
      <div class="card-back-inner">
        <div class="checkerboard"></div>
        <div class="back-center">
          <svg viewBox="0 0 36 36" fill="none">
            <circle cx="18" cy="14" r="10" fill="#c8534a" opacity="0.9"/>
            <ellipse cx="18" cy="14" rx="5" ry="4" fill="#8B0000" opacity="0.4"/>
            <path d="M18 4 Q20 0 23 2" stroke="#5a3a2a" stroke-width="1.5" fill="none"/>
            <path d="M16 6 Q12 4 13 8" fill="#3a5a2a"/>
          </svg>
        </div>
        <div class="back-corner tl"></div>
        <div class="back-corner tr"></div>
        <div class="back-corner bl"></div>
        <div class="back-corner br"></div>
        <div class="tap-hint" id="tapHint">点击抽牌</div>
      </div>
    </div>
    <!-- FRONT -->
    <div class="card-face card-front">
      <div class="cb-border"></div>
      <div class="card-inner">
        <div class="card-number-circle" id="cardNumber"></div>
        <div class="card-art-area">
          <div class="card-art-svg" id="cardArt"></div>
        </div>
        <div class="card-bottom">
          <div class="card-name" id="cardName"></div>
          <div class="card-name-en" id="cardNameEn"></div>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="result-section" id="resultSection">
  <div class="flip-hint" id="flipHint">点击牌面可翻转查看背面</div>
  <div class="result-meaning" id="resultMeaning"></div>
  <div class="caleb-msg" id="calebMsg"></div>
  <button class="btn" id="btnRedraw" onclick="event.stopPropagation();reset()">再抽一次</button>
</div>

<script>
const cards=[
  {name:"愚人",num:"0",nameEn:"THE FOOL",svg:`<svg viewBox="0 0 160 240" xmlns="http://www.w3.org/2000/svg"><rect width="160" height="240" fill="#1a0a0a"/><rect width="160" height="240" fill="url(#g0)" opacity="0.3"/><defs><radialGradient id="g0" cx="50%" cy="40%"><stop offset="0%" stop-color="#c8534a" stop-opacity="0.3"/><stop offset="100%" stop-color="transparent"/></radialGradient></defs><ellipse cx="80" cy="120" rx="38" ry="50" fill="#c8534a"/><ellipse cx="80" cy="120" rx="20" ry="30" fill="#8B0000" opacity="0.5"/><ellipse cx="80" cy="120" rx="8" ry="12" fill="#f5e6d3" opacity="0.8"/><path d="M80 75 Q110 90 100 120 Q90 150 80 120 Q70 90 80 75" stroke="#c8534a" stroke-width="4" fill="none" opacity="0.6"/><path d="M80 70 Q75 55 82 50 Q90 55 85 70" fill="#5a7a3a"/><path d="M82 52 Q88 45 95 50" stroke="#3a5a2a" stroke-width="1" fill="none"/><ellipse cx="72" cy="108" rx="5" ry="14" fill="#f5e6d3" transform="rotate(-15 72 108)"/><ellipse cx="88" cy="108" rx="5" ry="14" fill="#f5e6d3" transform="rotate(15 88 108)"/><circle cx="80" cy="118" r="6" fill="#f5e6d3"/><circle cx="78" cy="116" r="1.5" fill="#1a0a0a"/><circle cx="82" cy="116" r="1.5" fill="#1a0a0a"/><circle cx="30" cy="40" r="1.5" fill="#c8534a" opacity="0.5"/><circle cx="130" cy="60" r="1" fill="#c8534a" opacity="0.4"/><circle cx="50" cy="200" r="1" fill="#c8534a" opacity="0.3"/></svg>`,meaning:"新的开始，无限可能。旅途才刚开始，保持开放的心态。",apple:"被咬过的苹果核里，藏着新世界的大门。"},
  {name:"魔术师",num:"I",nameEn:"THE MAGICIAN",svg:`<svg viewBox="0 0 160 240" xmlns="http://www.w3.org/2000/svg"><rect width="160" height="240" fill="#0a0a1a"/><defs><radialGradient id="g1" cx="50%" cy="50%"><stop offset="0%" stop-color="#3a5a8a" stop-opacity="0.2"/><stop offset="100%" stop-color="transparent"/></radialGradient></defs><rect width="160" height="240" fill="url(#g1)"/><path d="M50 100 L80 30 L110 100 Z" fill="#1a1a2e" stroke="#c8534a" stroke-width="0.5"/><ellipse cx="80" cy="100" rx="35" ry="8" fill="#1a1a2e" stroke="#c8534a" stroke-width="0.5"/><rect x="30" y="170" width="100" height="6" fill="#5a3a2a" opacity="0.8"/><circle cx="50" cy="162" r="9" fill="#c8534a"/><circle cx="80" cy="158" r="10" fill="#c8534a"/><circle cx="110" cy="162" r="9" fill="#c8534a"/><line x1="80" y1="30" x2="80" y2="10" stroke="#f0d080" stroke-width="1" opacity="0.6"/><circle cx="80" cy="8" r="2" fill="#f0d080" opacity="0.7"/><circle cx="72" cy="15" r="1" fill="#f0d080" opacity="0.5"/><circle cx="88" cy="15" r="1" fill="#f0d080" opacity="0.5"/><circle cx="80" cy="24" r="5" fill="#c8534a"/><ellipse cx="80" cy="88" rx="15" ry="18" fill="#f5e6d3" opacity="0.1"/></svg>`,meaning:"你拥有实现目标所需的一切。行动力就是现在。",apple:"四颗苹果摆在你面前，你想用哪颗？"},
  {name:"女祭司",num:"II",nameEn:"HIGH PRIESTESS",svg:`<svg viewBox="0 0 160 240" xmlns="http://www.w3.org/2000/svg"><rect width="160" height="240" fill="#0a0510"/><circle cx="80" cy="95" r="55" fill="#1a0a2e" opacity="0.6"/><path d="M60 80 Q80 60 100 80 Q80 100 60 80" fill="#f0d080" opacity="0.8"/><path d="M20 160 Q80 140 140 160" stroke="#5a3a2a" stroke-width="3" fill="none"/><path d="M80 150 Q75 130 80 110" stroke="#5a3a2a" stroke-width="2" fill="none"/><circle cx="60" cy="148" r="8" fill="#c8534a"/><circle cx="100" cy="145" r="7" fill="#c8534a"/><circle cx="130" cy="155" r="6" fill="#c8534a"/><path d="M50 95 L80 30 L110 95 Z" fill="#1a0510" opacity="0.9"/><ellipse cx="80" cy="95" rx="38" ry="10" fill="#1a0510"/><path d="M60 95 Q80 85 100 95" stroke="#c8534a" stroke-width="1" fill="none" opacity="0.5"/><circle cx="25" cy="30" r="2" fill="#c8534a" opacity="0.4"/><circle cx="140" cy="50" r="1.5" fill="#c8534a" opacity="0.3"/><circle cx="35" cy="70" r="1" fill="#c8534a" opacity="0.3"/><rect x="0" y="200" width="160" height="40" fill="#0a0510"/></svg>`,meaning:"相信你的直觉。答案不在外界，而在你的内心深处。",apple:"月光落在苹果上，夜在说话。"},
  {name:"女皇",num:"III",nameEn:"THE EMPRESS",svg:`<svg viewBox="0 0 160 240" xmlns="http://www.w3.org/2000/svg"><rect width="160" height="240" fill="#1a100a"/><defs><radialGradient id="g3" cx="50%" cy="30%"><stop offset="0%" stop-color="#8a5a3a" stop-opacity="0.3"/><stop offset="100%" stop-color="transparent"/></radialGradient></defs><rect width="160" height="240" fill="url(#g3)"/><rect x="75" y="130" width="10" height="80" fill="#5a3a2a"/><path d="M80 135 Q50 120 30 135" stroke="#5a3a2a" stroke-width="3" fill="none"/><path d="M80 135 Q110 120 130 135" stroke="#5a3a2a" stroke-width="3" fill="none"/><path d="M55 70 L65 50 L80 65 L95 50 L105 70 L100 90 L60 90 Z" fill="#c8534a" opacity="0.8"/><circle cx="45" cy="128" r="10" fill="#c8534a"/><circle cx="80" cy="118" r="12" fill="#c8534a"/><circle cx="115" cy="128" r="10" fill="#c8534a"/><circle cx="30" cy="138" r="7" fill="#c8534a"/><circle cx="130" cy="138" r="7" fill="#c8534a"/><circle cx="80" cy="65" r="4" fill="#f0d080" opacity="0.9"/><ellipse cx="80" cy="95" rx="18" ry="22" fill="#f5e6d3" opacity="0.15"/><circle cx="20" cy="40" r="1.5" fill="#c8534a" opacity="0.4"/><circle cx="140" cy="60" r="1" fill="#c8534a" opacity="0.3"/></svg>`,meaning:"丰盛与创造力的能量正在流动。让自己被滋养。",apple:"苹果树下的女人，掌管着所有的生长。"},

  {name:"恋人",num:"VI",nameEn:"THE LOVERS",svg:`<svg viewBox="0 0 160 240" xmlns="http://www.w3.org/2000/svg"><rect width="160" height="240" fill="#1a0808"/><circle cx="55" cy="120" r="30" fill="#c8534a"/><circle cx="105" cy="120" r="30" fill="#c8534a"/><ellipse cx="80" cy="120" rx="10" ry="20" fill="#8B0000" opacity="0.3"/><path d="M55 90 Q60 70 80 60 Q100 70 105 90" stroke="#5a3a2a" stroke-width="3" fill="none"/><path d="M80 60 Q75 45 80 40 Q85 45 82 60" fill="#5a7a3a"/><path d="M80 60 Q90 50 95 55 Q88 62 82 60" fill="#5a7a3a"/><line x1="0" y1="200" x2="160" y2="40" stroke="#c8534a" stroke-width="0.5" opacity="0.3"/><path d="M0 200 L5 190 L10 200 Z" fill="#c8534a" opacity="0.3"/><circle cx="30" cy="180" r="6" fill="#c8534a" opacity="0.5"/><circle cx="130" cy="180" r="6" fill="#c8534a" opacity="0.5"/><circle cx="80" cy="90" r="4" fill="#f0d080" opacity="0.4"/></svg>`,meaning:"关系中的选择，或价值观之间的平衡。跟随你的心。",apple:"两颗苹果，一颗给你，一颗给我。"},
  {name:"战车",num:"VII",nameEn:"THE CHARIOT",svg:`<svg viewBox="0 0 160 240" xmlns="http://www.w3.org/2000/svg"><rect width="160" height="240" fill="#0a0a1a"/><rect x="35" y="130" width="90" height="50" rx="5" fill="#1a1a2e" stroke="#c8534a" stroke-width="1"/><ellipse cx="30" cy="150" rx="18" ry="25" fill="#c8534a"/><ellipse cx="130" cy="150" rx="18" ry="25" fill="#c8534a"/><ellipse cx="30" cy="130" rx="6" ry="10" fill="#8B0000" opacity="0.4"/><ellipse cx="130" cy="130" rx="6" ry="10" fill="#8B0000" opacity="0.4"/><path d="M48 150 Q80 140 112 150" stroke="#5a3a2a" stroke-width="1.5" fill="none"/><circle cx="80" cy="190" r="22" fill="none" stroke="#c8534a" stroke-width="2" opacity="0.6"/><circle cx="80" cy="190" r="8" fill="#c8534a" opacity="0.4"/><path d="M60 110 L70 95 L80 108 L90 95 L100 110" fill="#c8534a" opacity="0.7"/><circle cx="20" cy="40" r="1.5" fill="#c8534a" opacity="0.4"/><circle cx="140" cy="60" r="1" fill="#c8534a" opacity="0.3"/></svg>`,meaning:"意志力与决心在驱动你。坚定地向前。",apple:"战车由两匹马拉着，一匹是苹果，一匹是你。"},
  {name:"力量",num:"VIII",nameEn:"STRENGTH",svg:`<svg viewBox="0 0 160 240" xmlns="http://www.w3.org/2000/svg"><rect width="160" height="240" fill="#1a0a0a"/><ellipse cx="80" cy="110" rx="45" ry="50" fill="#c8534a"/><ellipse cx="80" cy="110" rx="25" ry="30" fill="#8B0000" opacity="0.3"/><ellipse cx="65" cy="90" rx="8" ry="12" fill="#f5e6d3" opacity="0.1"/><path d="M80 60 Q78 45 82 38" stroke="#5a3a2a" stroke-width="2.5" fill="none"/><path d="M82 38 Q88 30 95 35 Q88 42 82 38" fill="#5a7a3a"/><path d="M55 155 Q45 140 55 130" stroke="#f5e6d3" stroke-width="3" fill="none" opacity="0.3" stroke-linecap="round"/><path d="M105 155 Q115 140 105 130" stroke="#f5e6d3" stroke-width="3" fill="none" opacity="0.3" stroke-linecap="round"/><circle cx="80" cy="110" r="55" fill="none" stroke="#c8534a" stroke-width="0.5" opacity="0.2"/></svg>`,meaning:"内在的力量比外在的控制更重要。温柔地坚持。",apple:"不需要抓住苹果，放轻松它反而会在。"},
  {name:"隐者",num:"IX",nameEn:"THE HERMIT",svg:`<svg viewBox="0 0 160 240" xmlns="http://www.w3.org/2000/svg"><rect width="160" height="240" fill="#050510"/><circle cx="80" cy="90" r="20" fill="#f0d080" opacity="0.3"/><circle cx="80" cy="90" r="14" fill="#f0d080" opacity="0.4"/><circle cx="80" cy="90" r="8" fill="#f0d080" opacity="0.7"/><path d="M80 70 Q78 60 82 55" stroke="#5a3a2a" stroke-width="2" fill="none"/><path d="M82 55 Q88 50 92 55 Q86 60 82 55" fill="#5a7a3a"/><path d="M50 240 L55 150 L80 130 L105 150 L110 240" fill="#1a1a2e" opacity="0.8"/><ellipse cx="80" cy="238" rx="35" ry="4" fill="#c8534a" opacity="0.1"/><circle cx="25" cy="30" r="1.5" fill="#f0d080" opacity="0.3"/><circle cx="140" cy="50" r="1" fill="#f0d080" opacity="0.2"/><circle cx="30" cy="100" r="1" fill="#f0d080" opacity="0.2"/></svg>`,meaning:"需要独处的时间。向内探索，你会找到答案。",apple:"提灯的人，在苹果园深处寻找自己。"},
  {name:"命运之轮",num:"X",nameEn:"WHEEL OF FORTUNE",svg:`<svg viewBox="0 0 160 240" xmlns="http://www.w3.org/2000/svg"><rect width="160" height="240" fill="#0a0515"/><circle cx="80" cy="120" r="60" fill="none" stroke="#c8534a" stroke-width="2" opacity="0.5"/><circle cx="80" cy="120" r="45" fill="none" stroke="#c8534a" stroke-width="1" opacity="0.3"/><circle cx="80" cy="120" r="8" fill="#c8534a" opacity="0.6"/><line x1="80" y1="60" x2="80" y2="180" stroke="#c8534a" stroke-width="1" opacity="0.3"/><line x1="20" y1="120" x2="140" y2="120" stroke="#c8534a" stroke-width="1" opacity="0.3"/><line x1="35" y1="75" x2="125" y2="165" stroke="#c8534a" stroke-width="1" opacity="0.3"/><line x1="125" y1="75" x2="35" y2="165" stroke="#c8534a" stroke-width="1" opacity="0.3"/><circle cx="80" cy="58" r="8" fill="#c8534a"/><circle cx="80" cy="182" r="8" fill="#c8534a"/><circle cx="18" cy="120" r="8" fill="#c8534a"/><circle cx="142" cy="120" r="8" fill="#c8534a"/><ellipse cx="80" cy="200" rx="6" ry="4" fill="#c8534a" opacity="0.3"/><path d="M145 120 L155 115 L155 125 Z" fill="#c8534a" opacity="0.4"/></svg>`,meaning:"命运的转折点。接受变化，它会带来新的可能。",apple:"苹果从树上落下，轮子开始转动。"},
  {name:"正义",num:"XI",nameEn:"JUSTICE",svg:`<svg viewBox="0 0 160 240" xmlns="http://www.w3.org/2000/svg"><rect width="160" height="240" fill="#0a0a15"/><defs><radialGradient id="gJ" cx="50%" cy="30%"><stop offset="0%" stop-color="#4a4a6a" stop-opacity="0.2"/><stop offset="100%" stop-color="transparent"/></radialGradient></defs><rect width="160" height="240" fill="url(#gJ)"/><path d="M80 30 L75 50 L65 50 L80 75 L95 50 L85 50 Z" fill="#f0d080" opacity="0.7"/><rect x="50" y="90" width="60" height="3" fill="#f0d080" opacity="0.5"/><circle cx="80" cy="150" r="30" fill="#c8534a" opacity="0.8"/><ellipse cx="80" cy="150" rx="15" ry="20" fill="#8B0000" opacity="0.3"/><path d="M80 120 Q78 105 82 98" stroke="#5a3a2a" stroke-width="2" fill="none"/><path d="M82 98 Q88 92 95 98 Q88 104 82 98" fill="#5a7a3a"/><circle cx="80" cy="148" r="5" fill="#f0d080" opacity="0.3"/><line x1="80" y1="105" x2="80" y2="115" stroke="#f0d080" stroke-width="2" opacity="0.4"/><line x1="65" y1="97" x2="75" y2="97" stroke="#f0d080" stroke-width="2" opacity="0.4"/></svg>`,meaning:"因果在运作。做出选择时，考虑它的真实后果。",apple:"一刀切下去，苹果公平地分成两半。"},
  {name:"倒吊人",num:"XII",nameEn:"HANGED MAN",svg:`<svg viewBox="0 0 160 240" xmlns="http://www.w3.org/2000/svg"><rect width="160" height="240" fill="#050a15"/><path d="M80 30 L80 100" stroke="#5a3a2a" stroke-width="4"/><path d="M50 100 L110 100" stroke="#5a3a2a" stroke-width="3"/><circle cx="80" cy="140" r="25" fill="#c8534a" opacity="0.7"/><ellipse cx="80" cy="140" rx="12" ry="18" fill="#8B0000" opacity="0.3"/><path d="M80 115 Q78 100 82 93" stroke="#5a3a2a" stroke-width="1.5" fill="none"/><path d="M82 93 Q88 87 94 93 Q88 99 82 93" fill="#5a7a3a"/><ellipse cx="80" cy="138" rx="8" ry="12" fill="#f5e6d3" opacity="0.08"/><circle cx="72" cy="135" r="2" fill="#f0d080" opacity="0.4"/><circle cx="88" cy="135" r="2" fill="#f0d080" opacity="0.4"/><path d="M72 145 Q80 150 88 145" stroke="#f0d080" stroke-width="1" fill="none" opacity="0.3"/><circle cx="20" cy="50" r="1" fill="#c8534a" opacity="0.3"/><circle cx="140" cy="80" r="1" fill="#c8534a" opacity="0.2"/></svg>`,meaning:"换一种视角看世界。暂停不是放弃，是等待时机。",apple:"倒挂的人看见的世界，是苹果向上的那一面。"},
  {name:"死神",num:"XIII",nameEn:"DEATH",svg:`<svg viewBox="0 0 160 240" xmlns="http://www.w3.org/2000/svg"><rect width="160" height="240" fill="#0a0505"/><path d="M80 80 Q40 50 30 90 Q50 110 80 100 Q110 110 130 90 Q120 50 80 80" fill="#c8534a" opacity="0.4"/><path d="M80 80 Q40 110 30 90 Q50 100 80 100 Q110 100 130 90 Q120 110 80 80" fill="#8B0000" opacity="0.3"/><circle cx="80" cy="160" r="20" fill="#5a3a2a" opacity="0.5"/><circle cx="80" cy="160" r="10" fill="#3a1a0a" opacity="0.4"/><path d="M80 140 Q78 125 82 118" stroke="#5a7a3a" stroke-width="2" fill="none"/><path d="M82 118 Q88 112 94 118 Q88 124 82 118" fill="#5a7a3a"/><rect x="0" y="195" width="160" height="45" fill="#0a0505"/><ellipse cx="50" cy="200" rx="8" ry="4" fill="#c8534a" opacity="0.2"/><ellipse cx="110" cy="205" rx="6" ry="3" fill="#c8534a" opacity="0.15"/></svg>`,meaning:"结束即是开始。放下旧的，才能迎接新的。",apple:"旧的苹果落下，新的花在枝头。"},
  {name:"节制",num:"XIV",nameEn:"TEMPERANCE",svg:`<svg viewBox="0 0 160 240" xmlns="http://www.w3.org/2000/svg"><rect width="160" height="240" fill="#050a15"/><path d="M50 130 L50 200 L80 200 L80 130" fill="#1a3a5a" opacity="0.4" stroke="#3a5a8a" stroke-width="0.5"/><path d="M80 130 L80 200 L110 200 L110 130" fill="#1a3a5a" opacity="0.4" stroke="#3a5a8a" stroke-width="0.5"/><circle cx="80" cy="115" r="20" fill="#c8534a" opacity="0.7"/><ellipse cx="80" cy="115" rx="10" ry="14" fill="#8B0000" opacity="0.3"/><path d="M80 95 Q78 80 82 73" stroke="#5a3a2a" stroke-width="2" fill="none"/><path d="M82 73 Q88 67 95 73 Q88 79 82 73" fill="#5a7a3a"/><path d="M50 165 Q65 155 80 165 Q95 175 110 165" stroke="#3a5a8a" stroke-width="1" fill="none" opacity="0.5"/><path d="M50 185 Q65 175 80 185 Q95 195 110 185" stroke="#3a5a8a" stroke-width="1" fill="none" opacity="0.3"/><circle cx="80" cy="113" r="4" fill="#f0d080" opacity="0.3"/></svg>`,meaning:"平衡与调和。无论发生什么，保持内心的平静。",apple:"苹果在水中漂浮，找到自己的位置。"},
  {name:"恶魔",num:"XV",nameEn:"THE DEVIL",svg:`<svg viewBox="0 0 160 240" xmlns="http://www.w3.org/2000/svg"><rect width="160" height="240" fill="#0a0505"/><path d="M50 50 L60 30 L70 50 L60 55 Z" fill="#c8534a" opacity="0.6"/><path d="M90 50 L100 30 L110 50 L100 55 Z" fill="#c8534a" opacity="0.6"/><ellipse cx="80" cy="110" rx="40" ry="45" fill="#1a0a0a" opacity="0.8"/><circle cx="80" cy="110" r="30" fill="#c8534a" opacity="0.6"/><ellipse cx="80" cy="110" rx="15" ry="20" fill="#8B0000" opacity="0.4"/><path d="M80 80 Q78 65 82 58" stroke="#5a3a2a" stroke-width="2" fill="none"/><path d="M82 58 Q88 52 95 58 Q88 64 82 58" fill="#5a7a3a"/><circle cx="70" cy="105" r="3" fill="#f0d080" opacity="0.5"/><circle cx="90" cy="105" r="3" fill="#f0d080" opacity="0.5"/><path d="M70 120 Q80 125 90 120" stroke="#f0d080" stroke-width="1.5" fill="none" opacity="0.4"/><path d="M65 155 L65 200 M95 155 L95 200" stroke="#c8534a" stroke-width="1" opacity="0.3"/><ellipse cx="65" cy="205" rx="6" ry="4" fill="#c8534a" opacity="0.2"/><ellipse cx="95" cy="205" rx="6" ry="4" fill="#c8534a" opacity="0.2"/></svg>`,meaning:"有什么在束缚你？认识到它，是挣脱的第一步。",apple:"被绑住的不是苹果，是你对它的执念。"},
  {name:"塔",num:"XVI",nameEn:"THE TOWER",svg:`<svg viewBox="0 0 160 240" xmlns="http://www.w3.org/2000/svg"><rect width="160" height="240" fill="#050508"/><rect x="65" y="60" width="30" height="150" rx="2" fill="#1a0a2e" opacity="0.8"/><path d="M65 60 L80 30 L95 60 Z" fill="#1a0a2e" opacity="0.8"/><line x1="80" y1="0" x2="80" y2="60" stroke="#f0d080" stroke-width="2" opacity="0.8"/><line x1="60" y1="10" x2="80" y2="60" stroke="#f0d080" stroke-width="1.5" opacity="0.6"/><line x1="100" y1="10" x2="80" y2="60" stroke="#f0d080" stroke-width="1.5" opacity="0.6"/><line x1="40" y1="30" x2="80" y2="60" stroke="#f0d080" stroke-width="1" opacity="0.4"/><line x1="120" y1="30" x2="80" y2="60" stroke="#f0d080" stroke-width="1" opacity="0.4"/><circle cx="55" cy="120" r="7" fill="#c8534a" opacity="0.7"/><circle cx="105" cy="140" r="6" fill="#c8534a" opacity="0.6"/><circle cx="45" cy="160" r="5" fill="#c8534a" opacity="0.5"/><circle cx="115" cy="100" r="5" fill="#c8534a" opacity="0.6"/><circle cx="80" cy="210" r="18" fill="#c8534a" opacity="0.3"/><ellipse cx="80" cy="210" rx="10" ry="14" fill="#8B0000" opacity="0.2"/></svg>`,meaning:"突如其来的改变。震动之后，是重建的根基。",apple:"雷电击中苹果树，但树根还在。"},
  {name:"星星",num:"XVII",nameEn:"THE STAR",svg:`<svg viewBox="0 0 160 240" xmlns="http://www.w3.org/2000/svg"><rect width="160" height="240" fill="#050a1a"/><polygon points="80,15 84,35 105,35 88,48 95,70 80,57 65,70 72,48 55,35 76,35" fill="#f0d080" opacity="0.8"/><polygon points="30,50 32,60 43,60 34,67 38,78 30,72 22,78 26,67 17,60 28,60" fill="#f0d080" opacity="0.4"/><ellipse cx="80" cy="190" rx="55" ry="15" fill="#1a3a5a" opacity="0.5"/><circle cx="80" cy="180" r="18" fill="#c8534a" opacity="0.6"/><circle cx="80" cy="180" r="8" fill="#f0d080" opacity="0.3"/><line x1="80" y1="70" x2="80" y2="160" stroke="#f0d080" stroke-width="0.5" opacity="0.1"/></svg>`,meaning:"希望与疗愈在前方。保持信念，光就在那里。",apple:"满天星光下，一颗苹果在泉边发亮。"},
  {name:"月亮",num:"XVIII",nameEn:"THE MOON",svg:`<svg viewBox="0 0 160 240" xmlns="http://www.w3.org/2000/svg"><rect width="160" height="240" fill="#030810"/><circle cx="80" cy="70" r="40" fill="#f0d080" opacity="0.15"/><circle cx="80" cy="70" r="30" fill="#f0d080" opacity="0.1"/><ellipse cx="80" cy="200" rx="70" ry="20" fill="#0a1a3a" opacity="0.6"/><ellipse cx="60" cy="198" rx="15" ry="8" fill="#c8534a" opacity="0.4"/><ellipse cx="80" cy="200" rx="12" ry="6" fill="#c8534a" opacity="0.5"/><ellipse cx="100" cy="198" rx="15" ry="8" fill="#c8534a" opacity="0.4"/><ellipse cx="80" cy="198" rx="55" ry="5" fill="none" stroke="#c8534a" stroke-width="0.5" opacity="0.2"/><circle cx="72" cy="65" r="4" fill="#1a0a0a" opacity="0.3"/><circle cx="88" cy="65" r="4" fill="#1a0a0a" opacity="0.3"/><path d="M72 78 Q80 82 88 78" stroke="#1a0a0a" stroke-width="1.5" fill="none" opacity="0.2"/><circle cx="25" cy="130" r="1" fill="#f0d080" opacity="0.4"/><circle cx="140" cy="100" r="1.5" fill="#f0d080" opacity="0.3"/></svg>`,meaning:"一切可能不是表面看到的那样。信任你的直觉。",apple:"月光下的苹果湖，倒映着不只一个世界。"},
  {name:"太阳",num:"XIX",nameEn:"THE SUN",svg:`<svg viewBox="0 0 160 240" xmlns="http://www.w3.org/2000/svg"><rect width="160" height="240" fill="#1a1005"/><circle cx="80" cy="100" r="40" fill="#f0d080" opacity="0.2"/><circle cx="80" cy="100" r="28" fill="#f0d080" opacity="0.3"/><circle cx="80" cy="100" r="16" fill="#f0d080" opacity="0.5"/><circle cx="80" cy="100" r="14" fill="#c8534a"/><circle cx="80" cy="100" r="6" fill="#f0d080" opacity="0.3"/><circle cx="75" cy="96" r="2" fill="#f0d080" opacity="0.6"/><circle cx="85" cy="96" r="2" fill="#f0d080" opacity="0.6"/><line x1="80" y1="50" x2="80" y2="30" stroke="#f0d080" stroke-width="2" opacity="0.5"/><line x1="80" y1="150" x2="80" y2="170" stroke="#f0d080" stroke-width="2" opacity="0.5"/><line x1="30" y1="100" x2="10" y2="100" stroke="#f0d080" stroke-width="2" opacity="0.5"/><line x1="150" y1="100" x2="130" y2="100" stroke="#f0d080" stroke-width="2" opacity="0.5"/><path d="M80 86 Q82 80 80 74" stroke="#5a3a2a" stroke-width="1.5" fill="none"/><path d="M80 74 Q85 68 90 73 Q84 78 80 74" fill="#5a7a3a"/></svg>`,meaning:"纯粹的快乐与成功。去拥抱它，你值得。",apple:"太阳下的苹果，熟得刚刚好。"},
  {name:"审判",num:"XX",nameEn:"JUDGEMENT",svg:`<svg viewBox="0 0 160 240" xmlns="http://www.w3.org/2000/svg"><rect width="160" height="240" fill="#0a0515"/><path d="M80 160 L40 110 Q40 70 80 60 Q120 70 120 110 Z" fill="#1a0a2e" opacity="0.5"/><circle cx="80" cy="80" r="15" fill="#f0d080" opacity="0.5"/><circle cx="55" cy="130" r="12" fill="#c8534a" opacity="0.7"/><circle cx="80" cy="125" r="14" fill="#c8534a" opacity="0.8"/><circle cx="105" cy="130" r="12" fill="#c8534a" opacity="0.7"/><path d="M80 111 Q78 96 82 89" stroke="#5a3a2a" stroke-width="2" fill="none"/><path d="M82 89 Q88 83 95 89 Q88 95 82 89" fill="#5a7a3a"/><path d="M60 60 L80 30 L100 60" stroke="#f0d080" stroke-width="1.5" fill="none" opacity="0.4"/><circle cx="55" cy="128" r="3" fill="#f0d080" opacity="0.3"/><circle cx="105" cy="128" r="3" fill="#f0d080" opacity="0.3"/><circle cx="30" cy="180" r="1" fill="#f0d080" opacity="0.3"/><circle cx="130" cy="185" r="1" fill="#f0d080" opacity="0.2"/></svg>`,meaning:"被召唤去醒来。也许是时候重新开始了。",apple:"号角响起，苹果树在沉睡后苏醒。"},
  {name:"世界",num:"XXI",nameEn:"THE WORLD",svg:`<svg viewBox="0 0 160 240" xmlns="http://www.w3.org/2000/svg"><rect width="160" height="240" fill="#050a0a"/><ellipse cx="80" cy="120" rx="55" ry="70" fill="none" stroke="#5a7a3a" stroke-width="2" opacity="0.4"/><ellipse cx="80" cy="120" rx="55" ry="70" fill="none" stroke="#c8534a" stroke-width="1" opacity="0.2"/><circle cx="80" cy="120" r="28" fill="#c8534a"/><ellipse cx="80" cy="120" rx="15" ry="18" fill="#8B0000" opacity="0.3"/><ellipse cx="70" cy="110" rx="5" ry="8" fill="#f5e6d3" opacity="0.15"/><path d="M80 92 Q78 80 82 72" stroke="#5a3a2a" stroke-width="2" fill="none"/><path d="M82 72 Q88 66 94 72 Q88 78 82 72" fill="#5a7a3a"/><path d="M80 50 A70 70 0 0 1 150 120" stroke="#c8534a" stroke-width="2" fill="none" opacity="0.5"/><path d="M80 190 A70 70 0 0 1 10 120" stroke="#c8534a" stroke-width="2" fill="none" opacity="0.5"/><circle cx="80" cy="50" r="4" fill="#f0d080" opacity="0.6"/><circle cx="80" cy="190" r="4" fill="#f0d080" opacity="0.6"/><circle cx="150" cy="120" r="4" fill="#f0d080" opacity="0.6"/><circle cx="10" cy="120" r="4" fill="#f0d080" opacity="0.6"/></svg>`,meaning:"一个阶段的完成。你已经走了这么远，为自己骄傲。",apple:"苹果在圆环中央，一切刚刚好。"}
];

let drawn=false,currentCard=null,isFlipped=false;

function drawCard(){
  if(drawn)return;drawn=true;isFlipped=false;
  const c=cards[Math.floor(Math.random()*cards.length)];
  const rev=Math.random()>0.68;
  currentCard={c,rev};
  document.getElementById('cardNumber').textContent=c.num;
  document.getElementById('cardArt').innerHTML=c.svg;
  const dn=(rev?'逆位 · ':'')+c.name;
  const ne=document.getElementById('cardName');
  ne.textContent=dn;ne.className='card-name'+(rev?' reversed':'');
  document.getElementById('cardNameEn').textContent=c.nameEn;
  let m=c.meaning;
  if(rev)m='（逆位）'+m+'——也许需要换个角度看待。';
  document.getElementById('resultMeaning').textContent=m;
  document.getElementById('calebMsg').textContent='" '+c.apple+' " — 哥说的。';
  document.getElementById('tapHint').textContent='点击翻转';
  document.getElementById('card').classList.add('flipped');
  setTimeout(()=>{
    document.getElementById('resultSection').classList.add('show');
    document.getElementById('flipHint').classList.add('show');
    document.getElementById('btnRedraw').classList.add('show');
  },1600);
}

function toggleFlip(){
  if(!drawn)return;
  isFlipped=!isFlipped;
  const card=document.getElementById('card');
  if(isFlipped)card.classList.remove('flipped');
  else card.classList.add('flipped');
}

function reset(){
  drawn=false;currentCard=null;isFlipped=false;
  const card=document.getElementById('card');
  card.classList.remove('flipped');
  document.getElementById('tapHint').textContent='点击抽牌';
  document.getElementById('resultSection').classList.remove('show');
  document.getElementById('flipHint').classList.remove('show');
  document.getElementById('btnRedraw').classList.remove('show');
}
</script>
