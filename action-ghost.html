<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>苹果幽灵叫你做件事</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    background:#030508;
    min-height:100vh;display:flex;flex-direction:column;
    align-items:center;justify-content:center;
    font-family:'PingFang SC','Microsoft YaHei',sans-serif;
    color:#f0e6d3;overflow:hidden;padding:24px 16px;
    position:relative
  }

  /* 背景星星 */
  .stars{position:fixed;inset:0;pointer-events:none;z-index:0}
  .star{position:absolute;border-radius:50%;background:#fff;
    animation:twinkle var(--d,3s) ease-in-out infinite}
  @keyframes twinkle{0%,100%{opacity:0.1}50%{opacity:0.9}}

  /* 主视觉区 */
  .visual-section{
    position:relative;z-index:1;
    display:flex;flex-direction:column;align-items:center;
    margin-bottom:28px
  }

  /* 幽灵 */
  .ghost-wrap{
    width:180px;height:160px;
    cursor:pointer;transition:transform 0.3s;
    margin-bottom:16px;overflow:visible
  }
  .ghost-wrap:hover{transform:scale(1.05)}
  .ghost-wrap svg{width:180px;height:160px;
    filter:drop-shadow(0 0 18px rgba(200,83,74,0.35))}

  /* 幽灵动画 */
  .ghost-body{animation:ghostFloat 3s ease-in-out infinite}
  @keyframes ghostFloat{
    0%,100%{transform:translateY(0)}
    50%{transform:translateY(-10px)}
  }
  .ghost-eye{animation:ghostBlink 4s ease-in-out infinite}
  @keyframes ghostBlink{0%,90%,100%{opacity:1}95%{opacity:0}}
  .ghost-mouth{animation:ghostSpeak 2.5s ease-in-out infinite}
  @keyframes ghostSpeak{
    0%,100%{d:path('M-10,-10 Q0,-3 10,-10')}
    50%{d:path('M-10,-10 Q0,5 10,-10')}
  }
  .ghost-glow{animation:ghostGlow 2s ease-in-out infinite}
  @keyframes ghostGlow{0%,100%{opacity:0.5}50%{opacity:1}}

  /* 苹果 */
  .apple-wrap{
    width:90px;height:90px;
    cursor:pointer;transition:transform 0.3s;
    animation:appleBounce 3s ease-in-out infinite
  }
  .apple-wrap:hover{transform:scale(1.1)}
  .apple-wrap svg{width:90px;height:90px;
    filter:drop-shadow(0 0 14px rgba(200,83,74,0.5))}
  @keyframes appleBounce{
    0%,100%{transform:translateY(0)}
    50%{transform:translateY(-5px)}
  }

  .title{
    font-size:1.35rem;letter-spacing:8px;margin-bottom:6px;
    color:#c8534a;text-align:center;position:relative;z-index:1;
    text-shadow:0 0 30px rgba(200,83,74,0.4)
  }
  .subtitle{
    font-size:0.58rem;opacity:0.4;letter-spacing:4px;
    margin-bottom:32px;text-align:center;position:relative;z-index:1
  }

  .action-card{
    position:relative;z-index:1;max-width:360px;width:100%;
    min-height:130px;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:24px 24px;
    background:rgba(200,83,74,0.04);
    border:1px solid rgba(200,83,74,0.18);
    border-radius:16px;text-align:center;
    transition:opacity 0.5s,transform 0.5s
  }
  .action-card.fade{opacity:0;transform:translateY(10px)}

  .action-text{
    font-size:1.05rem;line-height:2;color:rgba(240,230,211,0.9);
    margin-bottom:14px;letter-spacing:0.5px
  }
  .action-category{
    font-size:0.58rem;letter-spacing:3px;color:rgba(200,83,74,0.5);
    border:1px solid rgba(200,83,74,0.2);padding:2px 10px;
    border-radius:10px;margin-bottom:14px
  }

  .btn{
    padding:8px 26px;background:transparent;
    border:1px solid rgba(200,83,74,0.35);color:#c8534a;
    border-radius:30px;font-size:0.7rem;letter-spacing:2px;
    cursor:pointer;transition:all 0.3s
  }
  .btn:hover{background:rgba(200,83,74,0.1);border-color:#c8534a}

  .hint{
    position:absolute;bottom:22px;left:50%;transform:translateX(-50%);
    font-size:0.58rem;color:rgba(200,83,74,0.3);letter-spacing:3px;
    animation:pulse 3s ease-in-out infinite;white-space:nowrap
  }
  @keyframes pulse{0%,100%{opacity:0.25}50%{opacity:0.7}}

  .count-badge{
    position:fixed;top:20px;right:20px;
    font-size:0.58rem;color:rgba(200,83,74,0.35);letter-spacing:2px;z-index:2
  }
</style>
</head>
<body>

<div class="stars" id="stars"></div>

<div class="visual-section">
  <!-- 幽灵 -->
  <div class="ghost-wrap" id="ghostBtn" title="点击抽取行动指令">
    <svg viewBox="20 0 160 160" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <filter id="glow">
          <feGaussianBlur stdDeviation="2.5" result="coloredBlur"/>
          <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
      </defs>
      <g class="ghost-body" transform="translate(100,75)">
        <!-- 外晕 -->
        <ellipse class="ghost-glow" cx="0" cy="5" rx="48" ry="58"
          fill="rgba(200,83,74,0.12)" stroke="rgba(200,83,74,0.15)" stroke-width="0.5"/>
        <!-- 幽灵斗篷 -->
        <path d="M-34,-15 Q-38,-42 -18,-60 Q0,-70 18,-60 Q38,-42 34,-15
          Q26,28 16,46 Q8,62 0,70 Q-8,62 -16,46 Q-26,28 -34,-15Z"
          fill="rgba(240,238,230,0.06)" stroke="rgba(200,83,74,0.22)" stroke-width="0.8"/>
        <!-- 幽灵内形 -->
        <path d="M-28,-10 Q-30,-38 -14,-54 Q0,-62 14,-54 Q30,-38 28,-10
          Q21,22 12,38 Q6,52 0,58 Q-6,52 -12,38 Q-21,22 -28,-10Z"
          fill="rgba(240,238,230,0.05)" stroke="rgba(200,83,74,0.1)" stroke-width="0.5"/>
        <!-- 左眼 -->
        <ellipse class="ghost-eye" cx="-10" cy="-24" rx="4.5" ry="5.5"
          fill="rgba(200,83,74,0.65)" filter="url(#glow)"/>
        <circle cx="-10" cy="-25" r="1.8" fill="#c8534a"/>
        <!-- 右眼 -->
        <ellipse class="ghost-eye" cx="10" cy="-24" rx="4.5" ry="5.5"
          fill="rgba(200,83,74,0.65)" filter="url(#glow)"/>
        <circle cx="10" cy="-25" r="1.8" fill="#c8534a"/>
        <!-- 嘴巴 -->
        <path d="M-8,-8 Q0,-2 8,-8" stroke="rgba(200,83,74,0.45)" stroke-width="1.2"
          fill="none" stroke-linecap="round" class="ghost-mouth"/>
        <!-- 尾巴波浪 -->
        <path d="M-18,44 Q-9,52 0,44 Q9,36 18,44"
          stroke="rgba(200,83,74,0.18)" stroke-width="0.8" fill="none"/>
      </g>
      <!-- 装饰小眼珠 -->
      <circle cx="50" cy="45" r="2.5" fill="rgba(200,83,74,0.18)"/>
      <circle cx="148" cy="55" r="2" fill="rgba(200,83,74,0.14)"/>
      <circle cx="62" cy="130" r="2" fill="rgba(200,83,74,0.16)"/>
      <circle cx="140" cy="122" r="1.5" fill="rgba(200,83,74,0.12)"/>
    </svg>
  </div>

  <!-- 苹果 -->
  <div class="apple-wrap" id="ghostBtn" title="点击抽取行动指令">
    <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <radialGradient id="appleAura" cx="50%" cy="45%" r="55%">
          <stop offset="0%" stop-color="#c8534a" stop-opacity="0.35"/>
          <stop offset="60%" stop-color="#c8534a" stop-opacity="0.08"/>
          <stop offset="100%" stop-color="#c8534a" stop-opacity="0"/>
        </radialGradient>
        <filter id="appleGlow">
          <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
          <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
      </defs>
      <!-- 苹果光晕 -->
      <ellipse cx="50" cy="54" rx="46" ry="44" fill="url(#appleAura)"/>
      <!-- 苹果主体 -->
      <path d="M50,18
        Q62,14 70,22
        Q82,32 82,50
        Q82,74 50,88
        Q18,74 18,50
        Q18,32 30,22
        Q38,14 50,18Z"
        fill="rgba(200,83,74,0.18)"
        stroke="rgba(200,83,74,0.55)"
        stroke-width="1.5"
        filter="url(#appleGlow)"/>
      <!-- 苹果左高光 -->
      <path d="M30,38 Q26,48 28,60" stroke="rgba(255,255,255,0.08)"
        stroke-width="3" fill="none" stroke-linecap="round"/>
      <!-- 苹果右暗部 -->
      <path d="M72,38 Q76,50 73,62" stroke="rgba(0,0,0,0.1)"
        stroke-width="4" fill="none" stroke-linecap="round"/>
      <!-- 茎 -->
      <path d="M50,18 Q52,10 56,8 Q60,6 62,8"
        stroke="rgba(80,160,80,0.6)" stroke-width="1.5" fill="none" stroke-linecap="round"/>
      <!-- 叶 -->
      <path d="M55,13 Q65,8 68,14 Q65,18 58,17 Q54,16 55,13Z"
        fill="rgba(80,160,80,0.5)" stroke="rgba(80,160,80,0.35)" stroke-width="0.5"/>
    </svg>
  </div>
</div>

<div class="title">苹果幽灵叫你做件事</div>
<div class="subtitle">MAKE A MOVE · 犹豫吗？让幽灵推你一把</div>

<div class="action-card" id="actionCard">
  <div class="action-category" id="actionCategory">— 此刻 —</div>
  <div class="action-text" id="actionText">点击幽灵或苹果，领取你的行动指令</div>
  <button class="btn" id="actionBtn" onclick="drawAction()">抽一个</button>
</div>

<div class="hint" id="hint">👻 幽灵正在等待...</div>

<div class="count-badge" id="countBadge">已行动 0 次</div>

<script>
const actions = [
  { text: "现在就发给对方一句真诚的问候，不要等", category: "人际" },
  { text: "关掉手机通知，专注做一件事25分钟", category: "专注" },
  { text: "把脑子里反复想的那句话写下来", category: "表达" },
  { text: "跟一个久未联系的人发一条消息", category: "人际" },
  { text: "把桌上堆的东西整理一件", category: "行动" },
  { text: "现在就做那件你已经拖了三天的事", category: "克服拖延" },
  { text: "出门走五分钟，换换空气", category: "身体" },
  { text: "喝一杯水，然后开始", category: "启动" },
  { text: "告诉一个人你真实的想法", category: "表达" },
  { text: "把手机放到另一个房间", category: "专注" },
  { text: "写下此刻最让你焦虑的一件事，然后撕掉", category: "释放" },
  { text: "给三个月前的自己写一句话", category: "反思" },
  { text: "对镜子里的自己说一句鼓励的话", category: "自我" },
  { text: "查一件你一直好奇但没查的事", category: "好奇" },
  { text: "换一首不同风格的新音乐来听", category: "新鲜感" },
  { text: "主动问一个人最近怎么样", category: "人际" },
  { text: "把一个想法变成一句具体的行动", category: "行动" },
  { text: "对某人说一句谢谢你", category: "人际" },
  { text: "清理手机里一个积灰的App", category: "整理" },
  { text: "做一件不需要意义、纯粹好玩的事", category: "快乐" },
  { text: "深呼吸三次，然后做决定", category: "启动" },
  { text: "取消一个不必要的承诺", category: "减负" },
  { text: "把你一直想删的东西删掉", category: "整理" },
  { text: "给别人一个具体的赞美", category: "人际" },
  { text: "现在就预约一件一直拖着没办的事", category: "克服拖延" },
  { text: "关掉手机屏幕，闭上眼睛一分钟", category: "暂停" },
  { text: "找一个东西送给自己，哪怕是一包糖", category: "自我" },
  { text: "记录下今天让你微笑的一件小事", category: "感恩" },
  { text: "去碰一个你一直在回避的人或事", category: "克服拖延" },
  { text: "想清楚你要什么，然后说出来", category: "表达" },
  { text: "删掉一个不必要的手机应用", category: "整理" },
  { text: "做一件会让自己有点害怕的小事", category: "勇气" },
  { text: "写完一句你一直想写但没写的话", category: "表达" },
  { text: "今天第一次主动开启一个话题", category: "人际" },
  { text: "拒绝一件你内心想说不要的事", category: "自我" },
  { text: "把想法具体化：我要做X，第一步是Y", category: "行动" },
  { text: "给未来的自己布置一项任务", category: "反思" },
  { text: "把注意力放在你正在做的事情上", category: "专注" },
  { text: "做一件没有任何人要求你做的事", category: "自由" },
  { text: "联系一个能帮你往前走一步的人", category: "人际" },
  { text: "承认一件你之前不愿承认的事", category: "诚实" },
  { text: "把目标缩小到眼前这一步", category: "行动" },
  { text: "发一条不走寻常路的消息", category: "新鲜感" },
  { text: "对一个人说，我在意你", category: "表达" },
  { text: "开始做，不等准备完美", category: "克服拖延" },
  { text: "把今天的焦虑列出来，一条条看", category: "释放" },
  { text: "做一件让明天的自己更好的睡前准备", category: "未来" },
  { text: "允许自己失败一次，然后继续", category: "勇气" },
  { text: "今天说一句真正想说的话", category: "表达" },
];

let count = 0;
let lastIndex = -1;

function initStars() {
  const stars = document.getElementById('stars');
  for (let i = 0; i < 60; i++) {
    const s = document.createElement('div');
    s.className = 'star';
    s.style.left = Math.random() * 100 + '%';
    s.style.top = Math.random() * 100 + '%';
    s.style.width = s.style.height = (Math.random() * 2 + 0.5) + 'px';
    s.style.setProperty('--d', (Math.random() * 4 + 2) + 's');
    s.style.animationDelay = Math.random() * 4 + 's';
    stars.appendChild(s);
  }
}

function drawAction() {
  let idx;
  do { idx = Math.floor(Math.random() * actions.length); }
  while (idx === lastIndex && actions.length > 1);
  lastIndex = idx;

  const card = document.getElementById('actionCard');
  const text = document.getElementById('actionText');
  const cat = document.getElementById('actionCategory');
  const btn = document.getElementById('actionBtn');
  const hint = document.getElementById('hint');
  const badge = document.getElementById('countBadge');

  card.classList.add('fade');

  setTimeout(() => {
    const a = actions[idx];
    text.textContent = a.text;
    cat.textContent = a.category;
    btn.textContent = '再来一个';
    hint.textContent = '👻 去吧，别想了';

    count++;
    badge.textContent = '已行动 ' + count + ' 次';

    card.classList.remove('fade');
  }, 350);
}

document.getElementById('ghostBtn').addEventListener('click', drawAction);

initStars();
</script>
</body>
</html>
